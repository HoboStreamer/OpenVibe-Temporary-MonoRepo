# alexfrison.conf — nginx vhost for alexfrison.net (Astro resume/portfolio site).
#
# Static files served from /var/www/alexfrison.net/dist (built via npm run build).
# Run: cd /var/www/alexfrison.net && npm install && npm run build

server {
    listen 80;
    listen [::]:80;
    server_name alexfrison.net www.alexfrison.net;
    return 301 https://alexfrison.net$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.alexfrison.net;

    ssl_certificate     /etc/letsencrypt/live/alexfrison.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alexfrison.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    return 301 https://alexfrison.net$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name alexfrison.net;

    ssl_certificate     /etc/letsencrypt/live/alexfrison.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alexfrison.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root  /var/www/alexfrison.net/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Versioned/hashed assets — immutable cache
    location ~* \.(js|css|woff2|woff|ttf|otf|svg|png|jpg|jpeg|webp|ico|gif)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # HTML / navigation — no cache (Astro outputs hashed filenames for assets)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~ /\.(?!well-known) { deny all; }
}
