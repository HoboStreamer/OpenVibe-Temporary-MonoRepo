add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Enable HSTS only once TLS is confirmed at the edge and origin routing is stable.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Keep CSP guidance conservative; player/embed exceptions should be added per-surface as needed.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; media-src 'self' https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https: wss:; frame-ancestors 'self'; base-uri 'self'" always;
