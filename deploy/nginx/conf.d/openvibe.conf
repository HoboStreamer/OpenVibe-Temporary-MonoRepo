upstream openvibe_network_upstream { server 127.0.0.1:4100; keepalive 64; }
upstream openvibe_events_upstream  { server 127.0.0.1:4400; keepalive 32; }
upstream openvibe_media_upstream   { server 127.0.0.1:4500; keepalive 32; }
upstream openvibe_live_upstream    { server 127.0.0.1:4600; keepalive 32; }
upstream openre_stream_upstream    { server 127.0.0.1:4700; keepalive 32; }
upstream openvibe_chat_upstream    { server 127.0.0.1:4800; keepalive 32; }
upstream openvibe_community_upstream { server 127.0.0.1:4900; keepalive 32; }
upstream openvibe_billing_upstream { server 127.0.0.1:5000; keepalive 16; }
upstream openvibe_ai_upstream      { server 127.0.0.1:5100; keepalive 16; }
upstream openvibe_games_upstream   { server 127.0.0.1:5200; keepalive 16; }

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-Id $request_id;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

server {
    listen 8080;
    server_name openvibe.network.localhost auth.openvibe.network.localhost api.openvibe.network.localhost admin.openvibe.network.localhost my.openvibe.network.localhost themes.openvibe.network.localhost openvibe.tools.localhost;

    location / {
        proxy_pass http://openvibe_network_upstream;
        proxy_read_timeout 120s;
    }
}

server {
    listen 8080;
    server_name openvibe.live.localhost;
    location / {
        proxy_pass http://openvibe_live_upstream;
        proxy_read_timeout 120s;
    }
}

server {
    listen 8080;
    server_name openre.stream.localhost;
    location / {
        proxy_pass http://openre_stream_upstream;
        proxy_read_timeout 300s;
    }
}

server {
    listen 8080;
    server_name openvibe.chat.localhost;
    location / {
        proxy_pass http://openvibe_chat_upstream;
        proxy_read_timeout 300s;
    }
}

server {
    listen 8080;
    server_name openvibe.community.localhost;
    location / {
        proxy_pass http://openvibe_community_upstream;
        proxy_read_timeout 180s;
    }
}

server {
    listen 8080;
    server_name billing.openvibe.network.localhost;
    location / {
        proxy_pass http://openvibe_billing_upstream;
        proxy_read_timeout 120s;
    }
}

server {
    listen 8080;
    server_name ai.openvibe.network.localhost;
    location / {
        proxy_pass http://openvibe_ai_upstream;
        proxy_read_timeout 180s;
    }
}

server {
    listen 8080;
    server_name openvibe.games.localhost;
    location / {
        proxy_pass http://openvibe_games_upstream;
        proxy_read_timeout 180s;
    }
}

server {
    listen 8080;
    server_name openvibe.media.localhost;
    client_max_body_size 512m;

    location / {
        proxy_pass http://openvibe_media_upstream;
        proxy_read_timeout 300s;
    }
}

server {
    listen 8080;
    server_name events.openvibe.network.localhost;
    location / {
        proxy_pass http://openvibe_events_upstream;
        proxy_read_timeout 120s;
    }
}
