# legacy-hobo.conf — nginx vhosts for the legacy Hobo Network services.
#
# These services run alongside OpenVibe on the same Pi.
# Ports:
#   hobostreamer  → 3000
#   hobo-tools    → 3100  (main SSO hub + wildcard *.hobo.tools)
#   hobo-quest    → 3200

# ── Rate limit zones (scoped to legacy, separate from OpenVibe zones) ─────────
limit_req_zone  $binary_remote_addr zone=hobo_api:10m    rate=10r/s;
limit_req_zone  $binary_remote_addr zone=hobo_login:10m  rate=5r/m;
limit_conn_zone $binary_remote_addr zone=hobo_conn:10m;

# ══════════════════════════════════════════════════════════════════════════════
# hobostreamer.com
# ══════════════════════════════════════════════════════════════════════════════

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name hobostreamer.com www.hobostreamer.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name hobostreamer.com www.hobostreamer.com;

    ssl_certificate     /etc/letsencrypt/live/hobostreamer.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hobostreamer.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 3m;
    limit_conn hobo_conn 30;

    # Trust Cloudflare real IPs (same ranges as openvibe.conf)
    real_ip_header    CF-Connecting-IP;
    real_ip_recursive on;
    set_real_ip_from  103.21.244.0/22;
    set_real_ip_from  103.22.200.0/22;
    set_real_ip_from  103.31.4.0/22;
    set_real_ip_from  141.101.64.0/18;
    set_real_ip_from  108.162.192.0/18;
    set_real_ip_from  104.16.0.0/13;
    set_real_ip_from  104.24.0.0/14;
    set_real_ip_from  172.64.0.0/13;
    set_real_ip_from  162.158.0.0/15;
    set_real_ip_from  173.245.48.0/20;
    set_real_ip_from  197.234.240.0/22;
    set_real_ip_from  198.41.128.0/17;

    add_header Permissions-Policy "camera=*, microphone=*, display-capture=*" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    # Auth endpoints — strict rate limit
    location = /api/auth/login {
        limit_req zone=hobo_login burst=10 nodelay;
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /api/auth/register {
        limit_req zone=hobo_login burst=5 nodelay;
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Static media — long-lived caches
    location ^~ /data/avatars/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location ^~ /api/thumbnails/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # VOD / clip uploads — large body, long timeout
    location ~ ^/api/vods/(upload|clips|stream/) {
        client_max_body_size 500m;
        proxy_read_timeout   300s;
        proxy_send_timeout   300s;
        proxy_pass           http://127.0.0.1:3000;
        proxy_http_version   1.1;
        proxy_set_header     Host $host;
        proxy_set_header     X-Real-IP $remote_addr;
        proxy_set_header     X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header     X-Forwarded-Proto $scheme;
        proxy_set_header     Upgrade $http_upgrade;
        proxy_set_header     Connection $connection_upgrade;
    }

    # API — rate limited, WebSocket-capable
    location /api/ {
        limit_req zone=hobo_api burst=40;
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
    }

    # Block dot-files except /.well-known
    location ~ /\.(?!well-known) { deny all; }

    # Everything else
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}

# ══════════════════════════════════════════════════════════════════════════════
# hobo.tools + *.hobo.tools
# ══════════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name hobo.tools *.hobo.tools;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name hobo.tools *.hobo.tools;

    ssl_certificate     /etc/letsencrypt/live/hobo.tools/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hobo.tools/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 250m;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    # Auth endpoints
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=hobo_login burst=10 nodelay;
        proxy_pass         http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Block dot-files
    location ~ /\.(?!well-known) { deny all; }

    location / {
        proxy_pass         http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}

# ══════════════════════════════════════════════════════════════════════════════
# hobo.quest
# ══════════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name hobo.quest;
    return 301 https://hobo.quest$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name hobo.quest;

    ssl_certificate     /etc/letsencrypt/live/hobo.quest/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hobo.quest/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 10m;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    location ~ /\.(?!well-known) { deny all; }

    location / {
        proxy_pass         http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}
