# ── openvibe.live (DNS-only — no CF proxy) ────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.live;

    ssl_certificate     /etc/letsencrypt/live/openvibe.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.live/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/openvibe-live.access.log;
    error_log  /var/log/nginx/openvibe-live.error.log;

    client_max_body_size 256m;

    location /events {
        proxy_pass http://openvibe_realtime_sse/events;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://openvibe_live_upstream;
        proxy_read_timeout 300s;
    }
}

