# OpenVibe production nginx vhost configuration.
# Installed to /etc/nginx/conf.d/openvibe.conf via install-nginx.sh.
#
# SSL certs: Let's Encrypt via certbot-dns-cloudflare (certbot-all-domains.sh)
# Upstream ports must match services defined in install-services.sh.
#
# DNS-only (grey cloud) domains serve TLS directly to clients:
#   openre.stream, openvibe.media, openvibe.live
# Cloudflare-proxied (orange cloud) domains use Cloudflare ↔ origin "Full (strict)":
#   everything else

# ── WebSocket upgrade map (needed for socket.io / streaming) ─────────────────
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Upstream backends ─────────────────────────────────────────────────────────
upstream openvibe_network_upstream   { server 127.0.0.1:4100; keepalive 64; }
upstream openvibe_api_upstream       { server 127.0.0.1:4200; keepalive 32; }
upstream openvibe_control_upstream   { server 127.0.0.1:4300; keepalive 16; }
upstream openvibe_events_upstream    { server 127.0.0.1:4400; keepalive 32; }
upstream openvibe_media_upstream     { server 127.0.0.1:4500; keepalive 32; }
upstream openvibe_live_upstream      { server 127.0.0.1:4600; keepalive 32; }
upstream openre_stream_upstream      { server 127.0.0.1:4700; keepalive 32; }
upstream openvibe_chat_upstream      { server 127.0.0.1:4800; keepalive 32; }
upstream openvibe_community_upstream { server 127.0.0.1:4900; keepalive 32; }
upstream openvibe_billing_upstream   { server 127.0.0.1:5001; keepalive 16; }
upstream openvibe_ai_upstream        { server 127.0.0.1:5100; keepalive 16; }
upstream openvibe_games_upstream     { server 127.0.0.1:5200; keepalive 16; }
upstream openvibe_workers_upstream   { server 127.0.0.1:5300; keepalive 16; }
upstream openvibe_realtime_upstream  { server 127.0.0.1:5400; keepalive 32; }
upstream openvibe_realtime_sse       { server 127.0.0.1:5400; }
upstream openvibe_content_upstream   { server 127.0.0.1:5500; keepalive 16; }
upstream openvibe_tips_upstream      { server 127.0.0.1:5600; keepalive 16; }
upstream openvibe_tools_upstream     { server 127.0.0.1:5700; keepalive 16; }

# ── Common proxy headers ──────────────────────────────────────────────────────
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Request-Id      $request_id;
proxy_set_header CF-Ray            $http_cf_ray;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

# ── HTTP → HTTPS redirect (all domains) ──────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name
        openvibe.network
        auth.openvibe.network
        api.openvibe.network
        admin.openvibe.network
        my.openvibe.network
        themes.openvibe.network
        billing.openvibe.network
        ai.openvibe.network
        realtime.openvibe.network
        events.openvibe.network
        workers.openvibe.network
        openvibe.tools
        openvibe.live
        openre.stream
        openvibe.chat
        openvibe.community
        openvibe.media
        openvibe.games
        openvibe.codes
        openvibe.blog
        openvibe.wiki
        openvibe.news
        openvibe.reviews
        openvibe.deals
        openvibe.coupons
        openvibe.trade
        openvibe.vip
        openvibe.host
        openvibe.tips;
    return 301 https://$host$request_uri;
}

# ── openvibe.network + core subdomains ───────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name
        openvibe.network
        auth.openvibe.network
        my.openvibe.network
        themes.openvibe.network
        workers.openvibe.network;

    ssl_certificate     /etc/letsencrypt/live/openvibe.network/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.network/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/openvibe-network.access.log;
    error_log  /var/log/nginx/openvibe-network.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-store" always;

    location /socket.io/ {
        proxy_pass http://openvibe_realtime_upstream/socket.io/;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://openvibe_network_upstream;
        proxy_read_timeout 120s;
    }
}

