# Placeholder cache guidance for safe public responses.
# Private APIs, auth, admin, billing, and /socket.io/ must remain uncacheable.
proxy_cache_path cache/openvibe levels=1:2 keys_zone=openvibe_public_cache:10m max_size=1g inactive=30m use_temp_path=off;
proxy_cache_key "$scheme$request_method$host$request_uri";
proxy_no_cache $http_authorization $cookie_openvibe_token $cookie_hobo_token;
proxy_cache_bypass $http_authorization $cookie_openvibe_token $cookie_hobo_token;
