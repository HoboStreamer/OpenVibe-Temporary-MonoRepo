# OpenVibe live nginx vhosts.
# Legacy hobo.tools / hobostreamer.com / hobo.quest remain managed separately
# until final redirect cutover is intentionally performed.

server {
    listen 80;
    listen [::]:80;
    server_name
        openvibe.network
        auth.openvibe.network
        api.openvibe.network
        admin.openvibe.network
        my.openvibe.network
        themes.openvibe.network
        openvibe.tools
        openvibe.live
        openre.stream
        openvibe.chat
        openvibe.community
        openvibe.media
        billing.openvibe.network
        ai.openvibe.network
        openvibe.games
        realtime.openvibe.network
        events.openvibe.network
        workers.openvibe.network
        openvibe.codes
        openvibe.blog
        openvibe.wiki
        openvibe.news
        openvibe.reviews
        openvibe.deals
        openvibe.coupons
        openvibe.trade;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name
        openvibe.network
        auth.openvibe.network
        api.openvibe.network
        admin.openvibe.network
        my.openvibe.network
        themes.openvibe.network;

    ssl_certificate /etc/letsencrypt/live/openvibe.network/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.network/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/openvibe-network.access.log cloudflare_combined;
    error_log /var/log/nginx/openvibe-network.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-store" always;

    location /socket.io/ {
        proxy_pass http://openvibe_realtime_upstream/socket.io/;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://openvibe_network_upstream;
        proxy_read_timeout 120s;
    }
}

