map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream openvibe_network_upstream {
    server 127.0.0.1:4100;
    keepalive 64;
}

upstream openvibe_events_upstream {
    server 127.0.0.1:4400;
    keepalive 32;
}

upstream openvibe_media_upstream {
    server 127.0.0.1:4500;
    keepalive 32;
}

upstream openvibe_live_upstream {
    server 127.0.0.1:4600;
    keepalive 32;
}

upstream openre_stream_upstream {
    server 127.0.0.1:4700;
    keepalive 32;
}

upstream openvibe_chat_upstream {
    server 127.0.0.1:4800;
    keepalive 32;
}

upstream openvibe_community_upstream {
    server 127.0.0.1:4900;
    keepalive 32;
}

upstream openvibe_billing_upstream {
    server 127.0.0.1:5001;
    keepalive 16;
}

upstream openvibe_ai_upstream {
    server 127.0.0.1:5100;
    keepalive 16;
}

upstream openvibe_games_upstream {
    server 127.0.0.1:5200;
    keepalive 16;
}

upstream openvibe_workers_upstream {
    server 127.0.0.1:5300;
    keepalive 16;
}

upstream openvibe_realtime_upstream {
    server 127.0.0.1:5400;
    keepalive 32;
}

upstream openvibe_content_upstream {
    server 127.0.0.1:5500;
    keepalive 16;
}

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Request-Id $request_id;
proxy_set_header CF-Ray $http_cf_ray;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
