services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: openvibe
      POSTGRES_PASSWORD: openvibe
      POSTGRES_DB: openvibe
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U openvibe -d openvibe']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - network
      - events
      - live
      - openre-stream
      - billing
      - media
      - chat
      - community
      - ai
      - games
      - workers
      - realtime
      - content
    network_mode: host
    restart: unless-stopped
    volumes:
      - ../../deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ../../deploy/nginx/mime.types:/etc/nginx/mime.types:ro

  network:
    image: node:20-bookworm
    working_dir: /workspace
    command: sh -lc "npm run start --workspace=@openvibe/network"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      events:
        condition: service_started
      realtime:
        condition: service_started
    env_file:
      - ../../.env
    environment:
      HOST: 0.0.0.0
      PORT: 4100
      OPENVIBE_PERSISTENCE_MODE: postgres
      OPENVIBE_DATABASE_URL: postgresql://openvibe:openvibe@postgres:5432/openvibe
      OPENVIBE_STAGING_DATABASE_URL: postgresql://openvibe:openvibe@postgres:5432/openvibe
      OPENVIBE_REDIS_URL: redis://redis:6379/0
      OPENVIBE_EVENTS_URL: http://events:4400
      OPENVIBE_WORKERS_INTERNAL_URL: http://workers:5300
      OPENVIBE_REALTIME_INTERNAL_URL: http://realtime:5400
      OPENVIBE_MEDIA_INTERNAL_URL: http://media:4500
      OPENVIBE_LIVE_INTERNAL_URL: http://live:4600
      OPENRE_STREAM_INTERNAL_URL: http://openre-stream:4700
      OPENVIBE_CHAT_INTERNAL_URL: http://chat:4800
      OPENVIBE_COMMUNITY_INTERNAL_URL: http://community:4900
      OPENVIBE_BILLING_INTERNAL_URL: http://billing:5000
      OPENVIBE_AI_INTERNAL_URL: http://ai:5100
      OPENVIBE_GAMES_INTERNAL_URL: http://games:5200
    ports:
      - '4100:4100'
    volumes:
      - ../../:/workspace

  events:
    image: node:20-bookworm
    working_dir: /workspace
    command: sh -lc "npm run start --workspace=@openvibe/events"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../../.env
    environment:
      HOST: 0.0.0.0
      PORT: 4400
      OPENVIBE_PERSISTENCE_MODE: postgres
      OPENVIBE_DATABASE_URL: postgresql://openvibe:openvibe@postgres:5432/openvibe
      OPENVIBE_STAGING_DATABASE_URL: postgresql://openvibe:openvibe@postgres:5432/openvibe
      OPENVIBE_REDIS_URL: redis://redis:6379/0
    ports:
      - '4400:4400'
    volumes:
      - ../../:/workspace

  live:
