name: openvibe-ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openvibe
          POSTGRES_PASSWORD: openvibe
          POSTGRES_DB: openvibe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openvibe"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      OPENVIBE_DATABASE_URL: postgresql://openvibe:openvibe@localhost:5432/openvibe
      OPENVIBE_STAGING_DATABASE_URL: postgresql://openvibe:openvibe@localhost:5432/openvibe
      OPENVIBE_REDIS_URL: redis://localhost:6379/0
      PGUSER: openvibe
      PGPORT: 5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Rebuild native addons
        run: npm rebuild better-sqlite3 --build-from-source

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Syntax check
        run: npm run check

      - name: Unit and smoke tests
        run: npm test

      - name: Offline scalable readiness
        run: npm run readiness

      - name: Start local production-like stack
        run: npm run stack:local:start

      - name: Wait for local production-like stack
        run: npm run stack:local:wait

      - name: HTTP browser smoke
        run: npm run smoke:browser

      - name: Playwright browser smoke
        run: npm run smoke:browser:playwright

      - name: Local production-like readiness
        run: npm run readiness:local-prod

      - name: Stop local production-like stack
        if: always()
        run: npm run stack:local:stop

      - name: Upload readiness artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openvibe-readiness-artifacts
          if-no-files-found: warn
          path: |
            data/readiness/**/*.json
            data/readiness/playwright/**/*.png
            data/migrations/browser-smoke-report.json
