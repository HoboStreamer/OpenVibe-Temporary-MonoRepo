<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SourceVibe Engine</title>
    <link rel="stylesheet" href="/sourcevibe-shared/ui/source-ui.css" />
    <link rel="stylesheet" href="./src/styles.css" />
</head>
<body>
    <div id="app-shell" class="launcher-shell">
        <header class="launcher-topbar">
            <div class="launcher-brand">
                <p class="eyebrow">OpenVibe Games Platform</p>
                <h1>SourceVibe Engine</h1>
                <p class="subtitle">The base runtime owns the directory, account-aware launch flow, shared console, and shared options. <strong>2D World</strong> is a flagship gamemode package, not the engine.</p>
            </div>
            <nav class="launcher-nav" id="sidebar-nav">
                <button data-view="home" class="nav-button active">Home</button>
                <button data-view="directory" class="nav-button">Directory</button>
                <button data-view="addons" class="nav-button">Addons</button>
                <button data-view="diagnostics" class="nav-button">Diagnostics</button>
            </nav>
            <div class="launcher-actions">
                <button class="toolbar-button" data-action="open-console">Console</button>
                <button class="toolbar-button" data-action="open-options">Options</button>
                <button class="toolbar-button" data-action="open-account">Account</button>
            </div>
        </header>

        <section id="status-banner" class="status-banner">Booting SourceVibe…</section>

        <main class="launcher-main">
            <aside id="session-card" class="identity-card launcher-identity"></aside>
            <section class="launcher-content">
                <section id="status-strip" class="status-strip"></section>
                <section id="view-home" class="panel-frame"></section>
                <section id="view-directory" class="panel-frame hidden"></section>
                <section id="view-addons" class="panel-frame hidden"></section>
                <section id="view-diagnostics" class="panel-frame hidden"></section>
            </section>
        </main>
    </div>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
