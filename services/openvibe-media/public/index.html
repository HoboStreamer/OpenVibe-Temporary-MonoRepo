<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OpenVibe Media</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="stylesheet" href="/assets/openvibe.css" />
</head>
<body>
<div id="nav-mount"></div>
<main class="ov-shell">
    <section class="ov-hero" style="padding-top:2rem;padding-bottom:1rem">
        <h1>OpenVibe Media</h1>
        <p>Shared media object store for every OpenVibe service. Hot SQLite + cold S3-compatible tier.</p>
    </section>

    <section class="ov-section">
        <h2>Upload</h2>
        <form id="upload-form" class="ov-card" style="gap:.5rem">
            <input class="ov-input" type="file" name="file" required />
            <input class="ov-input" name="kind" placeholder="kind (e.g. avatar, clip, paste-image)" value="generic" />
            <button class="ov-btn ov-btn-primary" type="submit">Upload</button>
            <div class="desc" id="up-status"></div>
        </form>
    </section>

    <section class="ov-section">
        <h2>Recent objects</h2>
        <table class="ov-table">
            <thead><tr><th>id</th><th>kind</th><th>size</th><th>tier</th><th>created</th></tr></thead>
            <tbody id="objects"><tr><td colspan="5" class="desc">loading…</td></tr></tbody>
        </table>
    </section>

    <section class="ov-section">
        <h2>Quotas</h2>
        <pre id="quota">loading…</pre>
    </section>
</main>
<div id="footer-mount"></div>
<script src="/assets/openvibe-icons.js"></script>
<script src="/assets/openvibe.js"></script>
<script>
(async function () {
    document.getElementById('nav-mount').innerHTML = OpenVibe.navbar();
    document.getElementById('footer-mount').innerHTML = OpenVibe.footer();

    function formatBytes(n) {
        if (!n) return '0';
        const u = ['B','KB','MB','GB','TB'];
        let i = 0; let v = Number(n);
        while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
        return v.toFixed(v < 10 ? 1 : 0) + ' ' + u[i];
    }

    function quotaQueryString() {
        const params = new URLSearchParams(window.location.search || '');
        const namespace = params.get('namespace');
        const ownerType = params.get('owner_type');
        const ownerId = params.get('owner_id');
        if (!namespace || !ownerType || !ownerId) return null;
        return new URLSearchParams({
            namespace,
            owner_type: ownerType,
            owner_id: ownerId,
        }).toString();
    }

    async function refresh() {
        try {
            const d = await fetch('/api/v1/media').then(r => r.json());
            const items = d.items || [];
            const tbody = document.getElementById('objects');
            tbody.innerHTML = items.length
                ? items.map(o => `<tr><td><code>${OpenVibe.escapeHtml(o.id)}</code></td><td>${OpenVibe.escapeHtml(o.kind || '')}</td><td>${formatBytes(o.size_bytes)}</td><td>${OpenVibe.escapeHtml(o.tier || 'hot')}</td><td>${OpenVibe.escapeHtml(o.created_at || '')}</td></tr>`).join('')
                : '<tr><td colspan="5" class="desc">no media yet</td></tr>';
        } catch (e) {
            document.getElementById('objects').innerHTML = `<tr><td colspan="5">listing requires auth (status ${e.status||'?'})</td></tr>`;
        }

        const quota = document.getElementById('quota');
        const quotaQuery = quotaQueryString();
        if (!quotaQuery) {
            quota.textContent = '(add ?namespace=...&owner_type=...&owner_id=... to inspect quota usage for a specific owner context)';
            return;
        }

        try {
            const q = await fetch(`/api/v1/quota?${quotaQuery}`).then(async (r) => {
                if (!r.ok) throw new Error(`quota ${r.status}`);
                return r.json();
            });
            quota.textContent = JSON.stringify(q, null, 2);
        } catch {
            quota.textContent = '(quota inspection requires a valid namespace / owner context)';
        }
    }
    refresh();

    document.getElementById('upload-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const file = fd.get('file');
        const kind = fd.get('kind');
        const status = document.getElementById('up-status');
        try {
            const init = await fetch('/api/v1/media/upload/init', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ kind, filename: file.name, content_type: file.type, size_bytes: file.size }),
            }).then(async r => { if (!r.ok) throw new Error(`init ${r.status}`); return r.json(); });
            const upFd = new FormData(); upFd.append('file', file);
            const up = await fetch(`/api/v1/media/${encodeURIComponent(init.id)}/upload`, { method: 'PUT', body: upFd });
            if (!up.ok) throw new Error(`upload ${up.status}`);
            await fetch(`/api/v1/media/${encodeURIComponent(init.id)}/upload/complete`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
            status.textContent = `uploaded as ${init.id}`;
            refresh();
        } catch (err) {
            status.textContent = `failed: ${err.message} (sign in required)`;
        }
    });
})();
</script>
</body>
</html>
