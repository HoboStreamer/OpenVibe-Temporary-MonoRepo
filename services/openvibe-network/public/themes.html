<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>themes.openvibe.network — themes catalog</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="stylesheet" href="/assets/openvibe.css" />
<style>
.theme-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 1rem;
    padding: 1.5rem 1.25rem 4rem;
    max-width: var(--ov-max);
    margin: 0 auto;
}
.theme-tile {
    all: unset;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    border-radius: 14px;
    overflow: hidden;
    border: 2px solid rgba(255,255,255,0.08);
    transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
}
.theme-tile:hover {
    border-color: rgba(255,255,255,0.22);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
}
.theme-tile--active {
    border-color: var(--ov-accent);
    box-shadow: 0 0 0 1px var(--ov-accent), 0 8px 24px rgba(0,0,0,0.35);
}
.theme-tile-preview {
    height: 130px;
    position: relative;
}
.theme-tile-accents {
    position: absolute;
    bottom: 8px;
    right: 8px;
    display: flex;
    gap: 4px;
}
.theme-tile-dot {
    display: block;
    width: 14px;
    height: 14px;
    border-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.5);
}
.theme-tile-name {
    display: block;
    padding: 0.5rem 0.75rem;
    font-size: 0.82rem;
    color: var(--ov-text-dim);
    background: color-mix(in srgb, var(--ov-bg) 90%, white);
    transition: color 0.15s;
}
.theme-tile--active .theme-tile-name {
    color: var(--ov-text);
}
#custom-palette {
    max-width: var(--ov-max);
    margin: 0 auto;
    padding: 0 1.25rem 3rem;
}
.cp-header {
    font-size: 1rem;
    font-weight: 700;
    color: var(--ov-text);
    margin-bottom: 0.25rem;
}
.cp-sub {
    font-size: 0.82rem;
    color: var(--ov-text-dim);
    margin-bottom: 1.25rem;
}
.cp-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 1rem;
}
.cp-field {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
}
.cp-label {
    font-size: 0.78rem;
    color: var(--ov-text-dim);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
}
.cp-swatch {
    width: 100%;
    height: 44px;
    border-radius: 10px;
    border: 2px solid rgba(255,255,255,0.1);
    cursor: pointer;
    padding: 2px;
    background: none;
}
.cp-swatch::-webkit-color-swatch-wrapper { padding: 0; }
.cp-swatch::-webkit-color-swatch { border-radius: 7px; border: none; }
.cp-swatch::-moz-color-swatch { border-radius: 7px; border: none; }
</style>
</head>
<body>
<div id="nav-mount"></div>
<div class="theme-grid" id="theme-grid"></div>
<div id="custom-palette" style="display:none">
    <p class="cp-header">Custom Palette</p>
    <p class="cp-sub">Pick your colors below — changes apply instantly across all services.</p>
    <div class="cp-grid">
        <div class="cp-field"><label class="cp-label" for="cp-bg">Background</label><input class="cp-swatch" type="color" id="cp-bg" value="#060917"></div>
        <div class="cp-field"><label class="cp-label" for="cp-accent">Accent</label><input class="cp-swatch" type="color" id="cp-accent" value="#8b5cf6"></div>
        <div class="cp-field"><label class="cp-label" for="cp-accent2">Accent 2</label><input class="cp-swatch" type="color" id="cp-accent2" value="#22d3ee"></div>
        <div class="cp-field"><label class="cp-label" for="cp-text">Text</label><input class="cp-swatch" type="color" id="cp-text" value="#eef4ff"></div>
        <div class="cp-field"><label class="cp-label" for="cp-textDim">Dim Text</label><input class="cp-swatch" type="color" id="cp-textDim" value="#a7b5d2"></div>
    </div>
</div>
<div id="footer-mount"></div>
<script src="/assets/openvibe-icons.js"></script>
<script src="/assets/openvibe.js"></script>
<script>
(async function () {
    await OpenVibe.primeEnvironment();
    await OpenVibe.renderChrome('themes');

    let currentThemeId = localStorage.getItem('openvibe.theme') || OpenVibe.BUILTIN_THEMES[0].id;
    OpenVibe.applyTheme(currentThemeId);

    const grid = document.getElementById('theme-grid');

    function render() {
        grid.innerHTML = OpenVibe.BUILTIN_THEMES.map((t) => `
            <button class="theme-tile${t.id === currentThemeId ? ' theme-tile--active' : ''}" data-theme-id="${OpenVibe.escapeHtml(t.id)}" type="button" title="${OpenVibe.escapeHtml(t.name)}">
                <div class="theme-tile-preview" style="background:${OpenVibe.escapeHtml(t.preview)}">
                    <div class="theme-tile-accents">
                        <span class="theme-tile-dot" style="background:${OpenVibe.escapeHtml(t.accent)}"></span>
                        <span class="theme-tile-dot" style="background:${OpenVibe.escapeHtml(t.accent2)}"></span>
                    </div>
                </div>
                <span class="theme-tile-name">${OpenVibe.escapeHtml(t.name)}</span>
            </button>`
        ).join('');
    }

    const customPanel = document.getElementById('custom-palette');
    const cpInputs = { bg: document.getElementById('cp-bg'), accent: document.getElementById('cp-accent'), accent2: document.getElementById('cp-accent2'), text: document.getElementById('cp-text'), textDim: document.getElementById('cp-textDim') };

    function loadCustomColors() {
        try {
            const cc = JSON.parse(localStorage.getItem('openvibe.theme.custom') || '{}');
            if (cc.bg)      cpInputs.bg.value      = cc.bg;
            if (cc.accent)  cpInputs.accent.value  = cc.accent;
            if (cc.accent2) cpInputs.accent2.value = cc.accent2;
            if (cc.text)    cpInputs.text.value    = cc.text;
            if (cc.textDim) cpInputs.textDim.value = cc.textDim;
        } catch {}
    }

    function saveAndApplyCustom() {
        const cc = { bg: cpInputs.bg.value, accent: cpInputs.accent.value, accent2: cpInputs.accent2.value, text: cpInputs.text.value, textDim: cpInputs.textDim.value };
        try { localStorage.setItem('openvibe.theme.custom', JSON.stringify(cc)); } catch {}
        OpenVibe.applyTheme('custom');
    }

    Object.values(cpInputs).forEach((inp) => inp.addEventListener('input', saveAndApplyCustom));

    function showCustomPanel(show) {
        customPanel.style.display = show ? 'block' : 'none';
        if (show) loadCustomColors();
    }

    render();
    showCustomPanel(currentThemeId === 'custom');

    grid.addEventListener('click', function (e) {
        const tile = e.target.closest('[data-theme-id]');
        if (!tile) return;
        currentThemeId = tile.dataset.themeId;
        OpenVibe.applyTheme(currentThemeId);
        showCustomPanel(currentThemeId === 'custom');
        render();
    });
})();
(function() {
    var h = location.hostname;
    var chatUrl = (h === 'localhost' || h.endsWith('.localhost'))
        ? 'http://openvibe.chat.localhost:4800'
        : 'https://openvibe.chat';
    var btn = document.createElement('a');
    btn.href = chatUrl;
    btn.target = '_blank';
    btn.rel = 'noopener';
    btn.setAttribute('aria-label', 'Open chat');
    btn.textContent = '💬';
    btn.style.cssText = 'position:fixed;bottom:1.25rem;right:1.25rem;z-index:9999;width:3rem;height:3rem;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#22d3ee);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,0.35);text-decoration:none;font-size:1.3rem;';
    document.body.appendChild(btn);
})();
</script>
</body>
</html>
