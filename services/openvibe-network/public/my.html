<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>my.openvibe.network — your account</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="stylesheet" href="/assets/openvibe.css" />
<style>
.ov-toggle-list {
    display: grid;
    gap: .85rem;
}
.ov-toggle-row {
    display: flex;
    align-items: flex-start;
    gap: .8rem;
    padding: .9rem 1rem;
    border-radius: 18px;
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.06);
}
.ov-toggle-row input {
    margin-top: .25rem;
}
/* Settings page layout */
.my-layout {
    display: grid;
    grid-template-columns: 180px 1fr;
    gap: 2.5rem;
    align-items: start;
    max-width: 960px;
    margin: 0 auto;
    padding: 2rem 1.5rem 5rem;
}
.my-sidenav {
    position: sticky;
    top: 5.5rem;
    display: flex;
    flex-direction: column;
    gap: .1rem;
}
.my-sidenav a {
    display: block;
    padding: .45rem .75rem;
    border-radius: 10px;
    font-size: .81rem;
    font-weight: 500;
    color: var(--ov-text-dim, #94a3b8);
    text-decoration: none;
    transition: background .12s, color .12s;
}
.my-sidenav a:hover {
    background: rgba(255,255,255,.07);
    color: var(--ov-text, #f1f5f9);
}
.my-sections {
    display: flex;
    flex-direction: column;
    gap: 0;
    min-width: 0;
}
.my-section {
    padding: 2rem 0;
    border-bottom: 1px solid rgba(255,255,255,.06);
}
.my-section:first-child {
    padding-top: 0;
}
.my-section:last-child {
    border-bottom: none;
}
.my-section-title {
    font-size: 1.05rem;
    font-weight: 700;
    margin: 0 0 .25rem;
    color: var(--ov-text, #f1f5f9);
}
.my-section-sub {
    font-size: .82rem;
    color: var(--ov-text-dim, #94a3b8);
    margin: 0 0 1.25rem;
}
@media (max-width: 640px) {
    .my-layout {
        grid-template-columns: 1fr;
        gap: 1rem;
    }
    .my-sidenav {
        position: static;
        flex-direction: row;
        flex-wrap: wrap;
        gap: .3rem;
        border-bottom: 1px solid rgba(255,255,255,.07);
        padding-bottom: 1rem;
        margin-bottom: 1rem;
    }
}
</style>
</head>
<body>
<div id="nav-mount"></div>
<main class="ov-shell">
    <section class="ov-hero">
        <div class="ov-hero-grid">
            <div class="ov-hero-copy">
                <span class="ov-kicker">My OpenVibe</span>
                <h1>Your account,<br><span class="ov-gradient">all in one place.</span></h1>
                <p>Profile, security, stream keys, chat settings, and bookmarks — scroll through everything without hunting across tabs.</p>
                <div class="ov-chip-row">
                    <span class="ov-chip soft" id="account-session-chip">Checking session…</span>
                    <span class="ov-chip primary" id="account-theme-chip">Loading theme…</span>
                </div>
                <div class="ov-cta-row" id="account-actions"></div>
            </div>
            <aside class="ov-panel" id="account-overview"></aside>
        </div>
    </section>

    <div class="my-layout">
        <nav class="my-sidenav" id="my-sidenav">
            <a href="#section-profile">Profile</a>
            <a href="#section-security">Security</a>
            <a href="#section-stream">Stream</a>
            <a href="#section-chat">Chat</a>
            <a href="#section-bookmarks">Bookmarks</a>
            <a href="#section-notifications">Notifications</a>
            <a href="#section-linked">Linked accounts</a>
            <a href="#section-theme">Theme</a>
        </nav>

        <div class="my-sections">
            <section class="my-section" id="section-profile"></section>
            <section class="my-section" id="section-security"></section>
            <section class="my-section" id="section-stream"></section>
            <section class="my-section" id="section-chat"></section>
            <section class="my-section" id="section-bookmarks"></section>
            <section class="my-section" id="section-notifications"></section>
            <section class="my-section" id="section-linked"></section>
            <section class="my-section" id="section-theme"></section>
        </div>
    </div>
</main>
<div id="footer-mount"></div>
<script src="/assets/openvibe-icons.js"></script>
<script src="/assets/openvibe.js"></script>
<script>
(async function () {
    function renderEmptyCard(title, message) {
        return `<div class="ov-empty"><strong>${OpenVibe.escapeHtml(title)}</strong><p style="margin:.5rem 0 0;">${OpenVibe.escapeHtml(message)}</p></div>`;
    }

    function themeCardMarkup(theme, currentThemeId) {
        const current = theme.id === currentThemeId;
        return `<article class="ov-card">
            <div style="height:82px; border-radius:16px; background:${OpenVibe.escapeHtml(theme.preview)}; border:1px solid rgba(255,255,255,.08);"></div>
            <div class="ov-chip-row" style="margin-top:.8rem;">
                <span class="ov-chip ${current ? 'ok' : 'soft'}">${current ? 'current' : 'catalog'}</span>
                <span class="ov-chip primary">${OpenVibe.escapeHtml(theme.id)}</span>
            </div>
            <h3 class="ov-service-title" style="margin-top:.8rem;">${OpenVibe.escapeHtml(theme.name)}</h3>
            <p class="ov-muted">${OpenVibe.escapeHtml(theme.description)}</p>
            <div class="ov-card-actions">
                <button class="ov-btn" type="button" data-preview-theme="${OpenVibe.escapeHtml(theme.id)}">Preview</button>
                <button class="ov-btn ov-btn-primary" type="button" data-apply-theme="${OpenVibe.escapeHtml(theme.id)}">Apply</button>
            </div>
        </article>`;
    }

    function linkedAccountMarkup(item) {
        const provider = item.provider || item.type || item.service || 'linked account';
        const identity = item.username || item.handle || item.external_username || item.external_id || item.id || 'connected';
        const secondary = [
            item.display_name || item.label || null,
            item.linked_at ? `linked ${OpenVibe.formatDateTime(item.linked_at)}` : null,
        ].filter(Boolean).join(' · ');
        return `<article class="ov-card">
            <div class="ov-chip-row"><span class="ov-chip ok">${OpenVibe.escapeHtml(provider)}</span></div>
            <h3 class="ov-service-title" style="margin-top:.8rem;">${OpenVibe.escapeHtml(identity)}</h3>
            <p class="ov-muted">${OpenVibe.escapeHtml(secondary || 'Imported or connected account identity.')}</p>
        </article>`;
    }

    function anonIdentityMarkup(item, currentId) {
        const current = item && item.id === currentId;
        const label = item && (item.display_name || item.username) ? (item.display_name || item.username) : `Anonymous #${item && item.anon_number || '?'}`;
        const subtitle = [
            item && item.anon_number ? `anon #${item.anon_number}` : 'anonymous identity',
            item && item.last_seen ? `last seen ${OpenVibe.formatRelativeTime(item.last_seen)}` : null,
            current ? 'current session' : null,
        ].filter(Boolean).join(' · ');
        return `<article class="ov-card">
            <div class="ov-chip-row">
                <span class="ov-chip ${current ? 'warn' : 'soft'}">${current ? 'current' : 'available'}</span>
                ${item && item.session_token ? '<span class="ov-chip ok">session saved</span>' : '<span class="ov-chip soft">needs refresh token</span>'}
            </div>
            <h3 class="ov-service-title" style="margin-top:.8rem;">${OpenVibe.escapeHtml(label)}</h3>
            <p class="ov-muted">${OpenVibe.escapeHtml(subtitle || 'Migrated anonymous identity')}</p>
            <div class="ov-card-actions">
                <button class="ov-btn ${current ? 'ov-btn-ghost' : 'ov-btn-primary'}" type="button" data-switch-anon-id="${OpenVibe.escapeHtml(item.id || '')}" data-switch-anon-token="${OpenVibe.escapeHtml(item.session_token || '')}" data-switch-anon-number="${OpenVibe.escapeHtml(String(item.anon_number || ''))}" ${current ? 'disabled' : ''}>${current ? 'Current identity' : 'Switch to this anon'}</button>
            </div>
        </article>`;
    }

    await OpenVibe.primeEnvironment();
    await OpenVibe.renderChrome('my');

    const session = await OpenVibe.loadSession();
    const overview = document.getElementById('account-overview');
    const actions = document.getElementById('account-actions');
    const isAnonymous = !!(session && session.anonymous && session.user);
    const anonymousIdentities = isAnonymous
        ? await OpenVibe.loadAnonymousIdentities().catch(() => ({ items: [session.user] }))
        : { items: [] };

    if (!session.authenticated || !session.user) {
        document.getElementById('account-session-chip').className = 'ov-chip warn';
        document.getElementById('account-session-chip').textContent = isAnonymous
            ? `${session.user.display_name || session.user.username || 'Anonymous'} active`
            : 'Not signed in';
        document.getElementById('account-theme-chip').textContent = 'Local preview theme only';
        actions.innerHTML = isAnonymous
            ? `<a class="ov-btn ov-btn-primary" href="${OpenVibe.signInUrl(OpenVibe.resolveSurfaceUrl('my'))}">Create or sign in to a full account</a>
                <button class="ov-btn" type="button" id="anon-create-new">New anonymous identity</button>
                <a class="ov-btn" href="${OpenVibe.resolveSurfaceUrl('tools')}">Browse tools</a>
                <a class="ov-btn ov-btn-ghost" href="${OpenVibe.signOutUrl(OpenVibe.resolveSurfaceUrl('network'))}">Leave anonymous</a>`
            : `<a class="ov-btn ov-btn-primary" href="${OpenVibe.signInUrl(OpenVibe.resolveSurfaceUrl('my'))}">Sign in to OpenVibe</a>
                <a class="ov-btn" href="${OpenVibe.resolveSurfaceUrl('themes')}">Preview themes</a>`;
        overview.innerHTML = isAnonymous
            ? `<div class="ov-chip-row" style="margin-bottom:.8rem;"><span class="ov-chip warn">${OpenVibe.escapeHtml(session.user.display_name || session.user.username || 'Anonymous')}</span><span class="ov-chip soft">${OpenVibe.escapeHtml(String((anonymousIdentities.items || []).length))} linked to this IP / fingerprint</span></div>
                <h2>Anonymous mode stays numbered</h2>
                <p class="ov-muted">This session is intentionally limited to the migrated anonymous identity namespace. The label comes from your anon number, not from an editable profile field, and the identity list below is sourced from the imported legacy IP/fingerprint continuity tables.</p>`
            : `<div class="ov-chip-row" style="margin-bottom:.8rem;"><span class="ov-chip warn">Guest mode</span></div>
                <h2>Account sync starts after sign-in</h2>
                <p class="ov-muted">Once authenticated, this page becomes your native account dashboard for profile data, linked services, themes, notifications, sessions, and launcher state.</p>`;

        // Hide the sidenav and all non-profile sections for unauthenticated users
        document.getElementById('my-sidenav').hidden = true;
        ['section-security','section-stream','section-chat','section-bookmarks','section-notifications','section-linked','section-theme'].forEach((id) => {
            document.getElementById(id).hidden = true;
        });

        document.getElementById('section-profile').innerHTML = isAnonymous ? `
            <h2 class="my-section-title">Anonymous identities</h2>
            <p class="my-section-sub">Switch between migrated anon numbers or mint a new one without losing the legacy mapping tied to this connection.</p>
            <div class="ov-action-row" style="justify-content:space-between; margin-bottom:1rem;">
                <span class="ov-muted" id="anon-identity-status">Current identity: ${OpenVibe.escapeHtml(session.user.display_name || session.user.username || 'Anonymous')}</span>
                <button class="ov-btn" type="button" id="anon-refresh-list">Refresh list</button>
            </div>
            <div class="ov-grid" id="anon-identity-grid">${(anonymousIdentities.items || []).length ? (anonymousIdentities.items || []).map((item) => anonIdentityMarkup(item, session.user.id)).join('') : renderEmptyCard('No saved anonymous identities', 'OpenVibe could not find any imported anon continuity records for this connection yet. You can still create a new anon identity below.')}</div>
            <div class="ov-action-row" style="justify-content:flex-end; margin-top:1rem;">
                <button class="ov-btn ov-btn-primary" type="button" id="anon-create-inline">Create another anonymous identity</button>
            </div>` : `
            <h2 class="my-section-title">What unlocks after sign-in</h2>
            <p class="my-section-sub">A quick preview of the OpenVibe-native account surface.</p>
            <div class="ov-grid">
                <article class="ov-card"><div class="ov-kicker">Profile</div><h3 class="ov-service-title" style="margin-top:.8rem;">Own your public identity</h3><p class="ov-muted">Edit username, display name, avatar URL, and richer profile metadata from one place.</p></article>
                <article class="ov-card"><div class="ov-kicker">Theme</div><h3 class="ov-service-title" style="margin-top:.8rem;">Sync visual preferences</h3><p class="ov-muted">Choose a network-wide theme stored in <code>openvibe.theme</code> instead of relying on old scattered settings.</p></article>
                <article class="ov-card"><div class="ov-kicker">Sessions</div><h3 class="ov-service-title" style="margin-top:.8rem;">Inspect active sign-ins</h3><p class="ov-muted">See the native auth sessions issued by the control plane and how recently they were seen.</p></article>
            </div>`;

        if (isAnonymous) {
            async function createNewAnon(button, statusEl) {
                if (button) {
                    button.disabled = true;
                    button.textContent = 'Creating anon…';
                }
                if (statusEl) statusEl.textContent = 'Creating a fresh anonymous identity…';
                try {
                    await OpenVibe.createAnonymousIdentity();
                    window.location.reload();
                } catch (error) {
                    if (statusEl) statusEl.textContent = `Could not create anon (${error.status || 'error'}).`;
                    if (button) {
                        button.disabled = false;
                        button.textContent = 'Create another anonymous identity';
                    }
                }
            }

            const statusEl = document.getElementById('anon-identity-status');
            const actionCreate = document.getElementById('anon-create-new');
            if (actionCreate) {
                actionCreate.addEventListener('click', function () {
                    createNewAnon(actionCreate, statusEl);
                });
            }
            const inlineCreate = document.getElementById('anon-create-inline');
            if (inlineCreate) {
                inlineCreate.addEventListener('click', function () {
                    createNewAnon(inlineCreate, statusEl);
                });
            }
            document.querySelectorAll('[data-switch-anon-id]').forEach((button) => {
                button.addEventListener('click', async function () {
                    button.disabled = true;
                    if (statusEl) statusEl.textContent = `Switching to Anonymous #${button.dataset.switchAnonNumber || '?'}…`;
                    try {
                        await OpenVibe.switchAnonymousIdentity({
                            id: button.dataset.switchAnonId,
                            session_token: button.dataset.switchAnonToken || '',
                            anon_number: button.dataset.switchAnonNumber || '',
                        });
                        window.location.reload();
                    } catch (error) {
                        button.disabled = false;
                        if (statusEl) statusEl.textContent = `Could not switch anon identity (${error.status || 'error'}).`;
                    }
                });
            });
            const refreshButton = document.getElementById('anon-refresh-list');
            if (refreshButton) {
                refreshButton.addEventListener('click', function () {
                    window.location.reload();
                });
            }
        }
        return;
    }

    const liveBase = OpenVibe.resolveSurfaceUrl('live');
    const [accountProfile, accountSessions, linkedAccounts, remoteServices, goLiveDash, chatSettingsMod] = await Promise.all([
        OpenVibe.loadAccountProfile().catch(() => null),
        OpenVibe.loadAccountSessions(),
        OpenVibe.loadAccountLinked(),
        OpenVibe.loadServices(),
        fetch(liveBase + '/api/v1/go-live/dashboard', { credentials: 'include' }).then((r) => r.json()).catch(() => null),
        OpenVibe.getUserModule('openvibe.chat_settings').catch(() => null),
    ]);

    const services = OpenVibe.mergedServices(remoteServices);
    const user = (accountProfile && accountProfile.user) || session.user;
    const publicProfile = (accountProfile && accountProfile.profile) || { data: {} };
    const notificationPrefs = (accountProfile && accountProfile.notifications && accountProfile.notifications.data) || {};
    let currentThemeId = (accountProfile && accountProfile.theme && accountProfile.theme.data && accountProfile.theme.data.theme_id)
        || localStorage.getItem('openvibe.theme')
        || OpenVibe.BUILTIN_THEMES[0].id;

    OpenVibe.applyTheme(currentThemeId);
    document.getElementById('account-session-chip').className = 'ov-chip ok';
    document.getElementById('account-session-chip').textContent = `Signed in as @${user.username || user.id}`;
    document.getElementById('account-theme-chip').textContent = `Theme: ${OpenVibe.themeById(currentThemeId).name}`;
    actions.innerHTML = `<a class="ov-btn ov-btn-primary" href="${OpenVibe.resolveSurfaceUrl('themes')}">Browse full theme catalog</a>
        <a class="ov-btn" href="${OpenVibe.resolveSurfaceUrl('tools')}">Open launcher</a>
        <a class="ov-btn ov-btn-ghost" href="${OpenVibe.signOutUrl(OpenVibe.resolveSurfaceUrl('network'))}">Sign out</a>`;

    overview.innerHTML = `
        <div class="ov-chip-row" style="margin-bottom:.8rem;">
            <span class="ov-chip ok">@${OpenVibe.escapeHtml(user.username || user.id)}</span>
            <span class="ov-chip soft">${OpenVibe.escapeHtml(user.role || 'user')}</span>
            ${user.email ? `<span class="ov-chip primary">${OpenVibe.escapeHtml(user.email)}</span>` : ''}
        </div>
        <h2>${OpenVibe.escapeHtml(user.display_name || user.username || 'OpenVibe user')}</h2>
        <p class="ov-muted">Profile, security, stream keys, chat settings, and bookmarks — all from one place.</p>
        <div class="ov-grid" style="margin-top:1rem;">
            <article class="ov-card"><span class="ov-chip primary">sessions</span><h3 class="ov-service-title" style="margin-top:.8rem;">${OpenVibe.escapeHtml(String((accountSessions.items || []).length))}</h3><p class="ov-muted">active session${(accountSessions.items || []).length === 1 ? '' : 's'}</p></article>
            <article class="ov-card"><span class="ov-chip primary">linked</span><h3 class="ov-service-title" style="margin-top:.8rem;">${OpenVibe.escapeHtml(String((linkedAccounts.items || []).length))}</h3><p class="ov-muted">linked provider${(linkedAccounts.items || []).length === 1 ? '' : 's'}</p></article>
        </div>`;

    // ── Profile ──────────────────────────────────────────────────────────────
    document.getElementById('section-profile').innerHTML = `
        <h2 class="my-section-title">Profile</h2>
        <p class="my-section-sub">Core auth fields plus extra profile metadata.</p>
        <form id="profile-form" class="ov-form-grid">
            <div class="ov-field"><label for="username">Username</label><input class="ov-input" id="username" name="username" value="${OpenVibe.escapeHtml(user.username || '')}" maxlength="32" required /><small>Your canonical @handle.</small></div>
            <div class="ov-field"><label for="display_name">Display name</label><input class="ov-input" id="display_name" name="display_name" value="${OpenVibe.escapeHtml(user.display_name || '')}" maxlength="80" /></div>
            <div class="ov-field"><label for="email">Email</label><input class="ov-input" id="email" name="email" type="email" value="${OpenVibe.escapeHtml(user.email || '')}" maxlength="160" /></div>
            <div class="ov-field"><label for="avatar_url">Avatar URL</label><input class="ov-input" id="avatar_url" name="avatar_url" value="${OpenVibe.escapeHtml(user.avatar_url || '')}" maxlength="400" placeholder="https://…" /></div>
            <div class="ov-field"><label for="tagline">Tagline</label><input class="ov-input" id="tagline" name="tagline" value="${OpenVibe.escapeHtml(publicProfile.data && publicProfile.data.tagline || '')}" maxlength="120" placeholder="Short one-line intro" /></div>
            <div class="ov-field"><label for="website">Website</label><input class="ov-input" id="website" name="website" value="${OpenVibe.escapeHtml(publicProfile.data && publicProfile.data.website || '')}" maxlength="240" placeholder="https://your.site" /></div>
            <div class="ov-field"><label for="location">Location</label><input class="ov-input" id="location" name="location" value="${OpenVibe.escapeHtml(publicProfile.data && publicProfile.data.location || '')}" maxlength="120" /></div>
            <div class="ov-field"><label for="pronouns">Pronouns</label><input class="ov-input" id="pronouns" name="pronouns" value="${OpenVibe.escapeHtml(publicProfile.data && publicProfile.data.pronouns || '')}" maxlength="60" /></div>
            <div class="ov-field" style="grid-column:1/-1;"><label for="bio">Bio</label><textarea class="ov-textarea" id="bio" name="bio" rows="4" placeholder="What should the network know about you?">${OpenVibe.escapeHtml(publicProfile.data && publicProfile.data.bio || '')}</textarea></div>
            <div class="ov-action-row" style="grid-column:1/-1; justify-content:space-between;">
                <span class="ov-muted" id="profile-status">Changes will update your native auth user and public profile.</span>
                <button class="ov-btn ov-btn-primary" type="submit">Save profile</button>
            </div>
        </form>`;

    // ── Security ─────────────────────────────────────────────────────────────
    function renderSecuritySection(sessions) {
        const currentToken = session.raw_token || '(not available in this context)';
        document.getElementById('section-security').innerHTML = `
            <h2 class="my-section-title">Security</h2>
            <p class="my-section-sub">Your API token, active sessions, and session management.</p>

            <div class="ov-card" style="margin-bottom:1.5rem;">
                <div class="ov-chip-row" style="margin-bottom:.8rem;"><span class="ov-chip warn">API token</span><span class="ov-chip soft">keep this secret</span></div>
                <p class="ov-muted" style="margin-bottom:.8rem;">Use this token to authenticate API requests. Never share it. Regenerate if compromised.</p>
                <div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;">
                    <input class="ov-input" id="token-display" type="password" value="${OpenVibe.escapeHtml(currentToken)}" readonly style="flex:1;min-width:0;font-family:monospace;font-size:.8rem;" />
                    <button class="ov-btn" type="button" id="token-reveal-btn">Reveal</button>
                    <button class="ov-btn" type="button" id="token-copy-btn">Copy</button>
                </div>
            </div>

            <h3 style="font-size:.85rem;font-weight:700;margin:0 0 .6rem;">Active sessions</h3>
            <p class="ov-muted" style="font-size:.8rem;margin:0 0 .9rem;">All auth sessions issued to your account. Revoke any you don't recognise.</p>
            <div id="sessions-table-wrap">
                <div class="ov-table-wrap">
                    <table class="ov-table">
                        <thead><tr><th>created</th><th>last seen</th><th>user agent</th><th>ip</th><th>state</th><th></th></tr></thead>
                        <tbody id="sessions-tbody">
                            ${(sessions || []).length
                                ? (sessions || []).map((row) => `<tr data-session-id="${OpenVibe.escapeHtml(row.id)}">
                                    <td>${OpenVibe.escapeHtml(OpenVibe.formatDateTime(row.created_at))}</td>
                                    <td>${OpenVibe.escapeHtml(OpenVibe.formatRelativeTime(row.last_seen_at || row.created_at))}</td>
                                    <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${OpenVibe.escapeHtml(row.user_agent || '—')}</td>
                                    <td>${OpenVibe.escapeHtml(row.ip_address || '—')}</td>
                                    <td>${row.revoked_at ? '<span class="ov-tag warn">revoked</span>' : '<span class="ov-tag ok">active</span>'}</td>
                                    <td>${row.revoked_at ? '' : `<button class="ov-btn ov-btn-ghost" type="button" data-revoke-session="${OpenVibe.escapeHtml(row.id)}" style="font-size:.75rem;padding:.3rem .7rem;">Revoke</button>`}</td>
                                </tr>`).join('')
                                : '<tr><td colspan="6">No sessions recorded yet.</td></tr>'}
                        </tbody>
                    </table>
                </div>
            </div>`;

        const revealBtn = document.getElementById('token-reveal-btn');
        const tokenInput = document.getElementById('token-display');
        revealBtn.addEventListener('click', function () {
            if (tokenInput.type === 'password') {
                tokenInput.type = 'text';
                revealBtn.textContent = 'Hide';
            } else {
                tokenInput.type = 'password';
                revealBtn.textContent = 'Reveal';
            }
        });
        document.getElementById('token-copy-btn').addEventListener('click', async function () {
            try {
                await navigator.clipboard.writeText(currentToken);
                document.getElementById('token-copy-btn').textContent = 'Copied!';
                setTimeout(() => { document.getElementById('token-copy-btn').textContent = 'Copy'; }, 2000);
            } catch {}
        });

        document.getElementById('section-security').querySelectorAll('[data-revoke-session]').forEach(function (btn) {
            btn.addEventListener('click', async function () {
                btn.disabled = true;
                btn.textContent = 'Revoking…';
                try {
                    await OpenVibe.api(`/account/sessions/${btn.dataset.revokeSession}`, { method: 'DELETE' });
                    btn.closest('tr').querySelector('.ov-tag').outerHTML = '<span class="ov-tag warn">revoked</span>';
                    btn.remove();
                } catch (error) {
                    btn.disabled = false;
                    btn.textContent = 'Revoke';
                }
            });
        });
    }
    renderSecuritySection(accountSessions.items || []);

    // ── Stream settings ──────────────────────────────────────────────────────
    (function () {
        const section = document.getElementById('section-stream');
        const channels = (goLiveDash && goLiveDash.channels) || [];
        const ch = channels[0] || null;
        const streamKey = (ch && ch.stream_key) || (ch && ch.metadata && ch.metadata.stream_key) || '';
        const slug = (ch && ch.slug) || (user.username || '');
        const restreamUrl = (goLiveDash && goLiveDash.restream_url) || OpenVibe.resolveSurfaceUrl('restream');
        const rtmpUrl = ch ? `${restreamUrl}/live/${slug}?key=${encodeURIComponent(streamKey)}` : '';
        const whipUrl = ch ? `${restreamUrl}/whip/${slug}?key=${encodeURIComponent(streamKey)}` : '';
        const jsmpegUrl = ch ? `${restreamUrl.replace(/^https?/, 'wss')}/jsmpeg/${slug}?key=${encodeURIComponent(streamKey)}` : '';

        function credRow(label, value) {
            const id = 'cred-' + label.replace(/\W/g, '');
            return `<div class="ov-field" style="grid-column:1/-1;">
                <label>${OpenVibe.escapeHtml(label)}</label>
                <div style="display:flex;gap:.5rem;align-items:center;">
                    <input class="ov-input" id="${id}" type="password" value="${OpenVibe.escapeHtml(value)}" readonly style="flex:1;font-family:monospace;font-size:.78rem;" />
                    <button class="ov-btn" type="button" onclick="var i=document.getElementById('${id}');i.type=i.type==='password'?'text':'password';this.textContent=i.type==='password'?'Show':'Hide'">Show</button>
                    <button class="ov-btn" type="button" onclick="navigator.clipboard.writeText('${value.replace(/'/g, "\\'")}').then(()=>{this.textContent='Copied!';setTimeout(()=>this.textContent='Copy',2000)}).catch(()=>{})">Copy</button>
                </div>
            </div>`;
        }

        section.innerHTML = `
            <h2 class="my-section-title">Stream settings</h2>
            <p class="my-section-sub">Your ingest credentials and channel settings. Keep your stream key secret.</p>
            ${ch ? `
            <div class="ov-card" style="margin-bottom:1.5rem;">
                <div class="ov-chip-row" style="margin-bottom:.8rem;"><span class="ov-chip ok">@${OpenVibe.escapeHtml(slug)}</span><span class="ov-chip soft">your channel</span></div>
                <div class="ov-form-grid" style="margin-top:1rem;">
                    ${credRow('RTMP', rtmpUrl)}
                    ${credRow('WHIP', whipUrl)}
                    ${credRow('JSMPEG', jsmpegUrl)}
                    <div class="ov-action-row" style="grid-column:1/-1;justify-content:flex-end;">
                        <span class="ov-muted" id="stream-key-status"></span>
                        <button class="ov-btn ov-btn-ghost" type="button" id="regen-key-btn">Regenerate stream key</button>
                    </div>
                </div>
            </div>
            <h3 style="font-size:.85rem;font-weight:700;margin:0 0 .8rem;">Channel settings</h3>
            <form id="channel-form" class="ov-form-grid">
                <div class="ov-field"><label for="ch-display-name">Display name</label><input class="ov-input" id="ch-display-name" name="display_name" value="${OpenVibe.escapeHtml(ch.display_name || '')}" maxlength="80" /></div>
                <div class="ov-field"><label for="ch-description">Description</label><input class="ov-input" id="ch-description" name="description" value="${OpenVibe.escapeHtml(ch.description || '')}" maxlength="280" /></div>
                <div class="ov-action-row" style="grid-column:1/-1;justify-content:space-between;">
                    <span class="ov-muted" id="channel-status"></span>
                    <button class="ov-btn ov-btn-primary" type="submit">Save channel settings</button>
                </div>
            </form>` : `
            <div class="ov-card">
                <p class="ov-muted">No channel found yet. Go live once to auto-create your channel, or visit the <a href="${OpenVibe.escapeHtml(liveBase + '/go-live')}">Go Live</a> page.</p>
            </div>`}`;

        if (!ch) return;

        document.getElementById('regen-key-btn').addEventListener('click', async function () {
            const btn = this;
            const status = document.getElementById('stream-key-status');
            btn.disabled = true;
            btn.textContent = 'Regenerating…';
            status.textContent = '';
            try {
                await fetch(liveBase + `/api/v1/go-live/channels/${slug}/regenerate-key`, { method: 'POST', credentials: 'include' });
                status.textContent = 'Key regenerated — refresh the page to see the new credentials.';
            } catch {
                status.textContent = 'Failed to regenerate key.';
            }
            btn.disabled = false;
            btn.textContent = 'Regenerate stream key';
        });

        document.getElementById('channel-form').addEventListener('submit', async function (event) {
            event.preventDefault();
            const form = event.currentTarget;
            const status = document.getElementById('channel-status');
            status.textContent = 'Saving…';
            try {
                await fetch(liveBase + `/api/v1/go-live/channels/${slug}`, {
                    method: 'PATCH',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ display_name: form.display_name.value, description: form.description.value }),
                });
                status.textContent = 'Channel settings saved.';
            } catch {
                status.textContent = 'Could not save channel settings.';
            }
        });
    })();

    // ── Chat settings ────────────────────────────────────────────────────────
    (function () {
        const chatSettings = (chatSettingsMod && chatSettingsMod.data) || {};
        const bannedWords = Array.isArray(chatSettings.banned_words) ? chatSettings.banned_words.join('\n') : '';
        document.getElementById('section-chat').innerHTML = `
            <h2 class="my-section-title">Chat settings</h2>
            <p class="my-section-sub">Moderation and chat preferences for your channel.</p>
            <form id="chat-settings-form" class="ov-form-grid">
                <div class="ov-field" style="grid-column:1/-1;">
                    <label for="banned-words">Banned words</label>
                    <textarea class="ov-textarea" id="banned-words" name="banned_words" rows="8" placeholder="One word or phrase per line. Case-insensitive.">${OpenVibe.escapeHtml(bannedWords)}</textarea>
                    <small>Messages containing any of these words will be blocked in your channel's chat. One entry per line.</small>
                </div>
                <div class="ov-action-row" style="grid-column:1/-1;justify-content:space-between;">
                    <span class="ov-muted" id="chat-settings-status">Stored in your account preferences.</span>
                    <button class="ov-btn ov-btn-primary" type="submit">Save chat settings</button>
                </div>
            </form>`;

        document.getElementById('chat-settings-form').addEventListener('submit', async function (event) {
            event.preventDefault();
            const form = event.currentTarget;
            const status = document.getElementById('chat-settings-status');
            status.textContent = 'Saving…';
            const words = form.banned_words.value.split('\n').map((w) => w.trim()).filter(Boolean);
            try {
                await OpenVibe.putUserModule('openvibe.chat_settings', { banned_words: words });
                status.textContent = 'Chat settings saved.';
            } catch (error) {
                status.textContent = `Could not save (${error.status || 'error'}).`;
            }
        });
    })();

    // ── Bookmarks ────────────────────────────────────────────────────────────
    function loadFavToolsCookie() {
        try { var m = document.cookie.match(/(?:^|;\s*)ov-tool-favs=([^;]*)/); return m ? JSON.parse(decodeURIComponent(m[1])) : []; } catch { return []; }
    }
    function loadFavStreams() {
        try { return JSON.parse(localStorage.getItem('ov-fav-streams') || '[]'); } catch { return []; }
    }
    function saveFavStreams(arr) {
        try { localStorage.setItem('ov-fav-streams', JSON.stringify(arr)); } catch {}
    }
    function removeFavToolCookie(id) {
        try {
            var favs = loadFavToolsCookie().filter((t) => t.id !== id);
            var domain = location.hostname.endsWith('.localhost') ? '.localhost' : location.hostname;
            document.cookie = 'ov-tool-favs=' + encodeURIComponent(JSON.stringify(favs)) + '; domain=' + domain + '; path=/; max-age=31536000; SameSite=Lax';
        } catch {}
    }

    async function renderBookmarksSection() {
        const toolsBase = OpenVibe.resolveSurfaceUrl('tools');
        const communityBase = OpenVibe.resolveSurfaceUrl('community');
        const isAuth = !!(session && session.authenticated);

        // Load all favorites — server-first for logged-in users, local fallback for guests
        let threads = [], channels = [], tools = [];
        let serverData = null;

        if (isAuth) {
            try {
                const mod = await OpenVibe.getUserModule('openvibe.favorites').catch(() => null);
                if (mod && mod.data) serverData = mod.data;
            } catch {}
        }

        threads  = (serverData && Array.isArray(serverData.threads))  ? serverData.threads  : (() => { try { return JSON.parse(localStorage.getItem('ov-fav-threads') || '[]'); } catch { return []; } })();
        channels = (serverData && Array.isArray(serverData.channels)) ? serverData.channels : loadFavStreams();
        tools    = (serverData && Array.isArray(serverData.tools))    ? serverData.tools    : loadFavToolsCookie();

        // Persist a merged snapshot back to both server and local storage
        async function saveFavs(t, c, o) {
            if (isAuth) {
                try { await OpenVibe.putUserModule('openvibe.favorites', { threads: t, channels: c, tools: o }); } catch {}
            }
            try { localStorage.setItem('ov-fav-threads', JSON.stringify(t)); } catch {}
            saveFavStreams(c);
            try {
                var domain = location.hostname.endsWith('.localhost') ? '.localhost' : location.hostname;
                document.cookie = 'ov-tool-favs=' + encodeURIComponent(JSON.stringify(o)) + '; domain=' + domain + '; path=/; max-age=31536000; SameSite=Lax';
            } catch {}
        }

        function bookmarkRow(icon, label, href, removeAttr, removeVal) {
            return `<div style="display:flex;gap:.65rem;align-items:center;padding:.5rem .6rem;border-radius:8px;border:1px solid var(--ov-border,rgba(255,255,255,.07));background:var(--ov-surface,rgba(255,255,255,.02));margin-bottom:.4rem;">
                <span style="font-size:1rem;flex-shrink:0;">${OpenVibe.escapeHtml(icon)}</span>
                <a href="${OpenVibe.escapeHtml(href)}" target="_blank" rel="noopener" style="flex:1;min-width:0;font-size:.82rem;font-weight:600;color:var(--ov-text,#f1f5f9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:none;">${OpenVibe.escapeHtml(label)}</a>
                <button class="ov-btn ov-btn-ghost" type="button" ${removeAttr}="${OpenVibe.escapeHtml(removeVal)}" style="font-size:.75rem;padding:.3rem .6rem;flex-shrink:0;">Remove</button>
            </div>`;
        }

        const section = document.getElementById('section-bookmarks');
        if (!section) return;
        section.innerHTML = `
            <h2 class="my-section-title">Bookmarks</h2>
            <p class="my-section-sub">Your saved channels, tools, and threads${isAuth ? ' — synced to your account' : ''}. Remove anything you no longer need.</p>

            <h3 style="font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ov-text-dim,#94a3b8);margin:.9rem 0 .4rem;">Channels</h3>
            <div id="bm-channels">${channels.length
                ? channels.map((c) => bookmarkRow('📺', c.name || c.id, c.url || '#', 'data-remove-channel', c.id)).join('')
                : '<p class="ov-muted" style="font-size:.85rem;">No saved channels yet. Star a streamer from openvibe.live.</p>'}</div>

            <h3 style="font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ov-text-dim,#94a3b8);margin:.9rem 0 .4rem;">Tools</h3>
            <div id="bm-tools">${tools.length
                ? tools.map((t) => bookmarkRow(t.icon || '🔧', t.title || t.id, toolsBase + t.id, 'data-remove-tool', t.id)).join('')
                : '<p class="ov-muted" style="font-size:.85rem;">No saved tools yet. Star tools from the tools directory.</p>'}</div>

            <h3 style="font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ov-text-dim,#94a3b8);margin:.9rem 0 .4rem;">Threads</h3>
            <div id="bm-threads">${threads.length
                ? threads.map((t) => bookmarkRow('💬', t.title || t.id, t.url || (communityBase + '/threads/' + t.id), 'data-remove-thread', t.id)).join('')
                : '<p class="ov-muted" style="font-size:.85rem;">No saved threads yet. Star threads from the community.</p>'}</div>`;

        section.querySelectorAll('[data-remove-channel]').forEach((btn) => {
            btn.addEventListener('click', async function () {
                channels = channels.filter((c) => c.id !== btn.dataset.removeChannel);
                await saveFavs(threads, channels, tools);
                renderBookmarksSection();
            });
        });
        section.querySelectorAll('[data-remove-tool]').forEach((btn) => {
            btn.addEventListener('click', async function () {
                tools = tools.filter((t) => t.id !== btn.dataset.removeTool);
                await saveFavs(threads, channels, tools);
                renderBookmarksSection();
            });
        });
        section.querySelectorAll('[data-remove-thread]').forEach((btn) => {
            btn.addEventListener('click', async function () {
                threads = threads.filter((t) => t.id !== btn.dataset.removeThread);
                await saveFavs(threads, channels, tools);
                renderBookmarksSection();
            });
        });
    }
    renderBookmarksSection();

    // ── Notifications ────────────────────────────────────────────────────────
    document.getElementById('section-notifications').innerHTML = `
        <h2 class="my-section-title">Notifications</h2>
        <p class="my-section-sub">Notification preference storage lives in <code>control.notification_preferences</code>.</p>
        <form id="notifications-form">
            <div class="ov-toggle-list">
                ${[
                    ['email', 'Email notifications', 'Useful for announcements, receipts, and alerts you should not miss.'],
                    ['browser', 'Browser notifications', 'Short in-browser signals for live, chat, or moderation activity.'],
                    ['live', 'Live alerts', 'Tell me when followed creators or highlighted surfaces go live.'],
                    ['mentions', 'Mentions and replies', 'Notify me when someone pings me in chat or community surfaces.'],
                    ['dms', 'Direct messages', 'Highlight new private conversations and requests.'],
                    ['system', 'System notices', 'Maintenance, migration readiness, and network-level operational messages.'],
                ].map(([key, label, desc]) => `<label class="ov-toggle-row"><input type="checkbox" name="${OpenVibe.escapeHtml(key)}" ${notificationPrefs[key] ? 'checked' : ''} /><span><strong>${OpenVibe.escapeHtml(label)}</strong><br><span class="ov-muted">${OpenVibe.escapeHtml(desc)}</span></span></label>`).join('')}
            </div>
            <div class="ov-action-row" style="justify-content:space-between; margin-top:1rem;">
                <span class="ov-muted" id="notifications-status">These choices are stored in your account preferences module.</span>
                <button class="ov-btn ov-btn-primary" type="submit">Save notification settings</button>
            </div>
        </form>`;

    // ── Linked accounts ──────────────────────────────────────────────────────
    document.getElementById('section-linked').innerHTML = `
        <h2 class="my-section-title">Linked accounts</h2>
        <p class="my-section-sub">Provider links surfaced from the native account record.</p>
        <div class="ov-grid" id="linked-grid">${(linkedAccounts.items || []).length ? (linkedAccounts.items || []).map(linkedAccountMarkup).join('') : renderEmptyCard('No linked providers yet', 'Migrated or newly linked provider identities will appear here as they are connected.')}</div>`;

    // ── Theme ────────────────────────────────────────────────────────────────
    document.getElementById('section-theme').innerHTML = `
        <h2 class="my-section-title">Theme</h2>
        <p class="my-section-sub">Preview locally here or jump into the full catalog page.</p>
        <div class="ov-card" style="margin-bottom:1rem;"><div class="ov-chip-row"><span class="ov-chip ok">Current theme</span><span class="ov-chip primary" id="theme-current-id">${OpenVibe.escapeHtml(currentThemeId)}</span></div><p class="ov-muted" id="theme-status" style="margin-top:.8rem;">${OpenVibe.escapeHtml(OpenVibe.themeById(currentThemeId).description)}</p></div>
        <div class="ov-grid" id="theme-grid">${OpenVibe.BUILTIN_THEMES.map((theme) => themeCardMarkup(theme, currentThemeId)).join('')}</div>`;

    // ── Form handlers ────────────────────────────────────────────────────────
    document.getElementById('profile-form').addEventListener('submit', async function (event) {
        event.preventDefault();
        const form = event.currentTarget;
        const status = document.getElementById('profile-status');
        status.textContent = 'Saving profile…';
        try {
            await OpenVibe.saveAccountProfile({
                username: form.username.value,
                display_name: form.display_name.value,
                email: form.email.value,
                avatar_url: form.avatar_url.value,
                profile: {
                    tagline: form.tagline.value,
                    website: form.website.value,
                    location: form.location.value,
                    pronouns: form.pronouns.value,
                    bio: form.bio.value,
                },
            });
            status.textContent = 'Profile saved.';
            document.getElementById('account-session-chip').textContent = `Signed in as @${form.username.value}`;
        } catch (error) {
            status.textContent = `Could not save profile (${error.status || 'error'}).`;
        }
    });

    document.getElementById('notifications-form').addEventListener('submit', async function (event) {
        event.preventDefault();
        const form = event.currentTarget;
        const status = document.getElementById('notifications-status');
        status.textContent = 'Saving…';
        const nextPrefs = Array.from(form.querySelectorAll('input[type="checkbox"]')).reduce((acc, inp) => {
            acc[inp.name] = inp.checked; return acc;
        }, {});
        try {
            await OpenVibe.putUserModule('control.notification_preferences', nextPrefs);
            status.textContent = 'Notification preferences saved.';
        } catch (error) {
            status.textContent = `Could not save (${error.status || 'error'}).`;
        }
    });

    document.getElementById('section-theme').addEventListener('click', async function (event) {
        const previewButton = event.target.closest('[data-preview-theme]');
        if (previewButton) {
            currentThemeId = previewButton.dataset.previewTheme;
            OpenVibe.applyTheme(currentThemeId);
            document.getElementById('account-theme-chip').textContent = `Theme: ${OpenVibe.themeById(currentThemeId).name}`;
            document.getElementById('theme-current-id').textContent = currentThemeId;
            document.getElementById('theme-status').textContent = OpenVibe.themeById(currentThemeId).description;
            document.getElementById('theme-grid').innerHTML = OpenVibe.BUILTIN_THEMES.map((theme) => themeCardMarkup(theme, currentThemeId)).join('');
            return;
        }
        const applyButton = event.target.closest('[data-apply-theme]');
        if (!applyButton) return;
        currentThemeId = applyButton.dataset.applyTheme;
        try {
            await OpenVibe.syncThemePreference(currentThemeId);
            document.getElementById('account-theme-chip').textContent = `Theme: ${OpenVibe.themeById(currentThemeId).name}`;
            document.getElementById('theme-current-id').textContent = currentThemeId;
            document.getElementById('theme-status').textContent = 'Theme saved to your account and applied locally.';
            document.getElementById('theme-grid').innerHTML = OpenVibe.BUILTIN_THEMES.map((theme) => themeCardMarkup(theme, currentThemeId)).join('');
        } catch (error) {
            document.getElementById('theme-status').textContent = `Could not save theme (${error.status || 'error'}).`;
        }
    });
})();
(function() {
    var h = location.hostname;
    var chatUrl = (h === 'localhost' || h.endsWith('.localhost'))
        ? 'http://openvibe.chat.localhost:4800'
        : 'https://openvibe.chat';
    var btn = document.createElement('a');
    btn.href = chatUrl;
    btn.target = '_blank';
    btn.rel = 'noopener';
    btn.setAttribute('aria-label', 'Open chat');
    btn.textContent = '💬';
    btn.style.cssText = 'position:fixed;bottom:1.25rem;right:1.25rem;z-index:9999;width:3rem;height:3rem;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#22d3ee);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,0.35);text-decoration:none;font-size:1.3rem;';
    document.body.appendChild(btn);
})();
</script>
</body>
</html>
