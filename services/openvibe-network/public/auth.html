<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>auth.openvibe.network</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="stylesheet" href="/assets/openvibe.css" />
</head>
<body>
<div id="nav-mount"></div>
<main class="ov-shell">
    <section class="ov-hero">
        <h1>OpenVibe Identity</h1>
        <p>Single sign-on for the OpenVibe network. RS256 JWTs, OIDC discovery, and JWKS published from this surface.</p>
        <div class="ov-cta-row">
            <a class="ov-btn ov-btn-primary" href="/oauth/authorize">Sign in</a>
            <a class="ov-btn" href="/.well-known/openid-configuration">OIDC discovery</a>
            <a class="ov-btn" href="/.well-known/jwks.json">JWKS</a>
        </div>
    </section>
    <section class="ov-section">
        <h2>Trusted issuers</h2>
        <p class="ov-section-sub">When <code>OPENVIBE_LEGACY_COMPAT_MODE=true</code> and <code>HOBO_TOOLS_URL</code> is set, hobo.tools tokens are also accepted.</p>
        <pre id="issuers">loading…</pre>
    </section>
</main>
<div id="footer-mount"></div>
<script src="/assets/openvibe-icons.js"></script>
<script src="/assets/openvibe.js"></script>
<script>
(async function () {
    document.getElementById('nav-mount').innerHTML = OpenVibe.navbar();
    document.getElementById('footer-mount').innerHTML = OpenVibe.footer();
    try {
        const j = await fetch('/health').then(r => r.json());
        document.getElementById('issuers').textContent = JSON.stringify(j, null, 2);
    } catch { document.getElementById('issuers').textContent = '(offline)'; }
})();
</script>
</body>
</html>
