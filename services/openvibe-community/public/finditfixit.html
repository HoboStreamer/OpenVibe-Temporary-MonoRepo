<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>FindItFixIt's Corner — OpenVibe Community</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="stylesheet" href="/assets/openvibe.css" />
<style>
    .fixit-section { margin: 2rem 0; }

    .fixit-col-left {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        width: 315px;
        height: 560px;
        flex-shrink: 0;
    }

    /* ─── Allergy Meter ─── */
    .allergy-meter {
        background: rgba(22, 24, 36, 0.85);
        border: 1px solid rgba(255,255,255,0.07);
        border-radius: 18px;
        padding: 1.25rem 1.5rem;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }
    .allergy-meter-header {
        display: flex; align-items: center; gap: 0.65rem;
        margin-bottom: 0.75rem;
    }
    .allergy-meter-icon { font-size: 1.2rem; }
    .allergy-meter-title {
        font-size: 0.78rem; font-weight: 700;
        text-transform: uppercase; letter-spacing: 0.08em;
        color: var(--ov-text-dim, #a7b5d2);
    }
    .allergy-meter-location {
        font-size: 0.72rem; color: var(--ov-text-dim, #a7b5d2);
        margin-left: auto; opacity: 0.7;
    }
    .allergy-bar-track {
        height: 8px; border-radius: 999px;
        background: rgba(255,255,255,0.06);
        overflow: hidden; margin-bottom: 0.65rem;
    }
    .allergy-bar-fill {
        height: 100%; border-radius: 999px;
        transition: width 1s cubic-bezier(.4,0,.2,1);
        background: linear-gradient(90deg, #22d3ee, #8b5cf6, #f59e0b);
        width: 0%;
    }
    .allergy-level-label {
        font-size: 1rem; font-weight: 700;
        margin-bottom: 0.2rem;
    }
    .allergy-culprit {
        font-size: 0.78rem; color: var(--ov-text-dim, #a7b5d2);
    }
    .allergy-levels {
        display: flex; margin-top: 0.85rem;
        border: 1px solid rgba(255,255,255,0.07); border-radius: 10px; overflow: hidden;
    }
    .allergy-level-tick {
        flex: 1; padding: 0.4rem 0.3rem; text-align: center;
        font-size: 0.65rem; font-weight: 600; color: var(--ov-text-dim, #a7b5d2);
        border-right: 1px solid rgba(255,255,255,0.07);
        transition: background .3s, color .3s;
    }
    .allergy-level-tick:last-child { border-right: none; }
    .allergy-level-tick.active { background: rgba(139,92,246,0.15); color: #fff; }

    /* ─── Deal Finder ─── */
    .deal-finder {
        background: rgba(22, 24, 36, 0.85);
        border: 1px solid rgba(255,255,255,0.07);
        border-radius: 18px;
        padding: 1.25rem 1.5rem;
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
    }
    .deal-finder-header {
        display: flex; align-items: center; gap: 0.65rem;
        margin-bottom: 0.85rem; flex-shrink: 0;
    }
    .deal-finder-title {
        font-size: 0.78rem; font-weight: 700;
        text-transform: uppercase; letter-spacing: 0.08em;
        color: var(--ov-text-dim, #a7b5d2);
    }
    .deal-finder-source {
        font-size: 0.68rem; color: var(--ov-text-dim, #a7b5d2);
        margin-left: auto; opacity: 0.6;
    }
    .deal-list {
        overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 0.5rem;
        scrollbar-width: thin; scrollbar-color: rgba(139,92,246,0.3) transparent;
    }
    .deal-item {
        display: block; padding: 0.55rem 0.7rem;
        background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
        border-radius: 10px; text-decoration: none;
        transition: background .2s, border-color .2s;
        flex-shrink: 0;
    }
    .deal-item:hover { background: rgba(139,92,246,0.1); border-color: rgba(139,92,246,0.25); }
    .deal-item-title {
        font-size: 0.78rem; font-weight: 600; color: #eef4ff;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .deal-item-meta {
        font-size: 0.68rem; color: var(--ov-text-dim, #a7b5d2); margin-top: 0.15rem;
    }
    .deal-empty {
        font-size: 0.8rem; color: var(--ov-text-dim, #a7b5d2);
        text-align: center; padding: 1rem 0;
    }

    /* ─── Floating Music Player ─── */
    .music-player {
        position: fixed;
        bottom: 1.5rem;
        right: 1.5rem;
        z-index: 9999;
        background: rgba(14, 16, 28, 0.92);
        backdrop-filter: blur(18px) saturate(140%);
        border: 1px solid rgba(139,92,246,0.25);
        border-radius: 999px;
        padding: 0.6rem 1rem;
        display: flex;
        align-items: center;
        gap: 0.65rem;
        box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 1px rgba(139,92,246,0.1);
    }
    .music-icon { color: #8b5cf6; display: grid; place-items: center; }
    .music-controls { display: flex; gap: 0.4rem; align-items: center; }
    .music-btn {
        background: none; border: none; cursor: pointer;
        color: var(--ov-text-dim, #a7b5d2); padding: 0.25rem;
        border-radius: 6px; display: grid; place-items: center;
        transition: color .2s, background .2s;
    }
    .music-btn:hover { color: #fff; background: rgba(255,255,255,0.08); }
    .music-btn.active { color: #8b5cf6; }
    .music-divider {
        width: 1px; height: 16px;
        background: rgba(255,255,255,0.1);
    }
    .music-autoplay-wrap input[type="checkbox"] {
        width: 14px; height: 14px; cursor: pointer;
        accent-color: #8b5cf6;
    }
</style>
</head>
<body>
<div id="nav-mount"></div>
<main class="ov-shell">
    <section class="fixit-section">
        <div style="display:flex; gap:1.5rem; align-items:flex-start; justify-content:center;">

            <div class="fixit-col-left">
                <!-- Allergy Meter -->
                <div class="allergy-meter">
                    <div>
                        <div class="allergy-meter-header">
                            <span class="allergy-meter-icon">🤧</span>
                            <span class="allergy-meter-title">Allergy Meter</span>
                            <span class="allergy-meter-location">📍 Killeen, TX</span>
                        </div>
                        <div class="allergy-bar-track">
                            <div class="allergy-bar-fill" id="allergy-bar"></div>
                        </div>
                        <div class="allergy-level-label" id="allergy-label">Checking outside…</div>
                        <div class="allergy-culprit" id="allergy-culprit"></div>
                    </div>
                    <div class="allergy-levels">
                        <div class="allergy-level-tick" id="tick-0">🌿 Fresh air</div>
                        <div class="allergy-level-tick" id="tick-1">😮‍💨 Clearing throat</div>
                        <div class="allergy-level-tick" id="tick-2">😤 High grunting</div>
                    </div>
                </div>

                <!-- Deal Finder -->
                <div class="deal-finder">
                    <div class="deal-finder-header">
                        <span>🍔</span>
                        <span class="deal-finder-title">Fast Food Deals</span>
                        <span class="deal-finder-source">via DuckDuckGo</span>
                    </div>
                    <div class="deal-list" id="deal-list">
                        <div class="deal-empty">Loading deals…</div>
                    </div>
                </div>
            </div>

            <!-- Short -->
            <iframe
                src="https://www.youtube.com/embed/cZJP-tUMqNg"
                title="FindItFixIt Short"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen
                style="border:none; border-radius:14px; width:315px; height:560px; flex-shrink:0;">
            </iframe>
        </div>
    </section>
</main>
<div id="footer-mount"></div>

<!-- Floating Music Player -->
<div class="music-player">
    <div class="music-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/>
        </svg>
    </div>
    <div class="music-controls">
        <button class="music-btn active" id="mp-play" title="Play">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="music-btn" id="mp-pause" title="Pause">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button class="music-btn" id="mp-stop" title="Stop">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12"/></svg>
        </button>
    </div>
    <div class="music-divider"></div>
    <div class="music-autoplay-wrap">
        <input type="checkbox" id="mp-autoplay" title="Disable autoplay" />
    </div>
</div>

<script src="/assets/openvibe.js"></script>
<script>
(async function () {
    if (OpenVibe.renderChrome) {
        await OpenVibe.renderChrome('community');
    } else {
        document.getElementById('nav-mount').innerHTML = OpenVibe.navbar();
        document.getElementById('footer-mount').innerHTML = OpenVibe.footer();
    }

    /* ─── Allergy Meter ─── */
    const LEVELS = [
        { label: 'Fresh air',                 pct: 12 },
        { label: 'Chance of clearing throat', pct: 55 },
        { label: 'High chance of grunting',   pct: 92 },
    ];
    const KILLEEN_SEASONS = [
        { level: 2, culprit: 'Mountain cedar is absolutely furious right now.' },
        { level: 2, culprit: 'Cedar winding down, oak just waking up.' },
        { level: 2, culprit: 'Oak and ash going full send.' },
        { level: 2, culprit: 'Oak, grass, and elm all at once. Good luck.' },
        { level: 1, culprit: 'Grass pollen season. Windows closed.' },
        { level: 1, culprit: 'Grass still going, mold spores joining the party.' },
        { level: 0, culprit: 'Mostly clear — heat bakes everything into nothing.' },
        { level: 0, culprit: 'Hot and dry. Air is actually fine.' },
        { level: 1, culprit: 'Ragweed season starting up.' },
        { level: 2, culprit: 'Ragweed peak. Cedar starting early. Classic Texas.' },
        { level: 1, culprit: 'Cedar season just getting warmed up.' },
        { level: 2, culprit: 'Mountain cedar. It is always cedar.' },
    ];
    function renderMeter() {
        const { level, culprit } = KILLEEN_SEASONS[new Date().getMonth()];
        const { label, pct } = LEVELS[level];
        document.getElementById('allergy-label').textContent = label;
        document.getElementById('allergy-culprit').textContent = culprit;
        requestAnimationFrame(() => { document.getElementById('allergy-bar').style.width = pct + '%'; });
        ['tick-0', 'tick-1', 'tick-2'].forEach((id, i) =>
            document.getElementById(id).classList.toggle('active', i === level));
    }

    /* ─── Deal Finder ─── */
    async function loadDeals() {
        const list = document.getElementById('deal-list');
        try {
            const res = await fetch('http://localhost:7779');
            const deals = await res.json();
            if (!deals.length) { list.innerHTML = '<div class="deal-empty">No deals found.</div>'; return; }
            list.innerHTML = deals.map(d => `
                <a class="deal-item" href="${d.url}" target="_blank" rel="noopener">
                    <div class="deal-item-title">${d.title}</div>
                    ${d.snippet ? `<div class="deal-item-meta">${d.snippet}</div>` : ''}
                </a>`).join('');
        } catch {
            list.innerHTML = '<div class="deal-empty">Couldn\'t load right now. Try again later.</div>';
        }
    }

    /* ─── Music Player ─── */
    const audio = new Audio('/audio/ameno-techno.mp3');
    audio.loop = true;

    const btnPlay    = document.getElementById('mp-play');
    const btnPause   = document.getElementById('mp-pause');
    const btnStop    = document.getElementById('mp-stop');
    const cbAutoplay = document.getElementById('mp-autoplay');

    const AUTOPLAY_KEY = 'fixit_autoplay_disabled';
    const autoplayDisabled = localStorage.getItem(AUTOPLAY_KEY) === '1';
    cbAutoplay.checked = autoplayDisabled;

    function setActive(btn) {
        [btnPlay, btnPause, btnStop].forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    btnPlay.addEventListener('click',  () => { audio.play(); setActive(btnPlay); });
    btnPause.addEventListener('click', () => { audio.pause(); setActive(btnPause); });
    btnStop.addEventListener('click',  () => { audio.pause(); audio.currentTime = 0; setActive(btnStop); });

    cbAutoplay.addEventListener('change', () => {
        localStorage.setItem(AUTOPLAY_KEY, cbAutoplay.checked ? '1' : '0');
    });

    if (!autoplayDisabled) {
        audio.play().catch(() => {});
    } else {
        setActive(btnStop);
    }

    renderMeter();
    loadDeals();
})();
</script>
</body>
</html>
