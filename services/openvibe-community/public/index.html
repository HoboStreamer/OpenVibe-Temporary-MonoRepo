<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Pastes — OpenVibe</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="stylesheet" href="/assets/openvibe.css" />
<style>
.ov-modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 1rem;
}
.ov-modal-overlay.open {
    display: flex;
}
.ov-modal {
    background: var(--ov-surface, #1a1a2e);
    border: 1px solid var(--ov-border, rgba(255,255,255,0.08));
    border-radius: 12px;
    width: 100%;
    max-width: 640px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 1.5rem;
    position: relative;
}
.ov-modal-close {
    position: absolute;
    top: 1rem;
    right: 1rem;
    background: none;
    border: none;
    color: var(--ov-muted, #888);
    font-size: 1.25rem;
    cursor: pointer;
    line-height: 1;
    padding: 0.25rem 0.5rem;
    border-radius: 6px;
}
.ov-modal-close:hover {
    color: var(--ov-text, #fff);
    background: var(--ov-hover, rgba(255,255,255,0.06));
}
.paste-card-img {
    width: 100%;
    height: 140px;
    object-fit: cover;
    border-radius: 6px;
    margin-bottom: 0.6rem;
    display: block;
}
</style>
</head>
<body>
<div id="nav-mount"></div>
<div id="community-phase16-chip" class="ov-chip" style="display:none" aria-hidden="true"></div>
<nav id="community-links" class="ov-muted" style="display:none" aria-hidden="true"></nav>
<main class="ov-shell">
    <section class="ov-section">
        <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap;">
            <h1 style="margin:0;font-size:1.5rem;color:var(--ov-text);">Pastes</h1>
            <button class="ov-btn ov-btn-primary" id="open-paste-modal-btn" style="margin-left:auto;">New paste</button>
        </div>
        <div class="ov-grid" id="pastes-grid"></div>
    </section>
</main>

<!-- Create paste modal -->
<div class="ov-modal-overlay" id="paste-modal" role="dialog" aria-modal="true" aria-labelledby="paste-modal-title">
    <div class="ov-modal">
        <button class="ov-modal-close" id="close-paste-modal-btn" aria-label="Close">&times;</button>
        <div class="ov-card-top" style="margin-bottom:1rem;">
            <div>
                <h2 id="paste-modal-title" style="margin:0;font-size:1.05rem;">Create a paste</h2>
                <div class="desc">Share a snippet, note, or idea.</div>
            </div>
            <span class="ov-tag" id="paste-mode-tag">sign-in required</span>
        </div>
        <form id="paste-form">
            <div class="ov-form-grid">
                <label class="ov-field">
                    <span>Title</span>
                    <input class="ov-input" name="title" placeholder="What's this about?" />
                </label>
            </div>
            <label class="ov-field" style="margin-top:0.85rem">
                <span>Body</span>
                <textarea class="ov-textarea" name="body" rows="6" placeholder="Paste body…"></textarea>
            </label>
            <label class="ov-field" style="margin-top:0.85rem">
                <span>Image URL <span class="ov-muted" style="font-weight:normal;">(optional)</span></span>
                <input class="ov-input" name="image_url" type="url" placeholder="https://example.com/image.png" />
            </label>
            <div class="ov-action-row" style="margin-top:1rem;">
                <button class="ov-btn ov-btn-primary" type="submit" id="paste-submit-btn">Create paste</button>
                <button class="ov-btn ov-btn-ghost" type="button" id="paste-reset-btn">Reset</button>
            </div>
            <div class="ov-banner" id="paste-status" style="margin-top:1rem">Sign in to create a new paste.</div>
        </form>
    </div>
</div>
<div id="footer-mount"></div>
<script src="/assets/openvibe-icons.js"></script>
<script src="/assets/openvibe.js?v=20260517-1"></script>
<script>
(async function () {
    await OpenVibe.primeEnvironment();
    await OpenVibe.renderChrome('community');

    const overlay = document.getElementById('paste-modal');

    function openModal() {
        overlay.classList.add('open');
        document.getElementById('paste-form').querySelector('[name="title"]').focus();
    }
    function closeModal() {
        overlay.classList.remove('open');
    }

    document.getElementById('open-paste-modal-btn').addEventListener('click', openModal);
    document.getElementById('close-paste-modal-btn').addEventListener('click', closeModal);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

    function excerpt(value, length) {
        const text = String(value || '').trim();
        if (!text) return '';
        return text.length > length ? text.slice(0, length - 1) + '…' : text;
    }

    async function loadPastes() {
        try {
            const res = await fetch('/api/community/pastes');
            if (!res.ok) return [];
            const data = await res.json();
            return data.items || [];
        } catch { return []; }
    }

    function renderPastes(items) {
        document.getElementById('pastes-grid').innerHTML = items.length
            ? items.map(paste => {
                const imgUrl = paste.metadata && paste.metadata.image_url ? OpenVibe.escapeHtml(paste.metadata.image_url) : null;
                return `
                <a class="ov-card" href="/p/${OpenVibe.escapeHtml(paste.slug || paste.id || '')}">
                    ${imgUrl ? `<img class="paste-card-img" src="${imgUrl}" alt="" loading="lazy" />` : ''}
                    <div class="ov-card-top">
                        <div>
                            <div class="ov-service-title">${OpenVibe.escapeHtml(paste.title || paste.slug || paste.id || 'untitled')}</div>
                            <div class="desc">${OpenVibe.escapeHtml(excerpt(paste.body, 140))}</div>
                        </div>
                        <span class="ov-tag">${OpenVibe.escapeHtml(paste.language || 'text')}</span>
                    </div>
                </a>`;
            }).join('')
            : '<div class="ov-empty">No pastes yet. Be the first to create one.</div>';
    }

    async function syncPasteComposer() {
        const session = await OpenVibe.loadSession().catch(() => ({ authenticated: false }));
        const modeTag = document.getElementById('paste-mode-tag');
        const status  = document.getElementById('paste-status');
        const submit  = document.getElementById('paste-submit-btn');

        if (session && session.authenticated && session.user) {
            modeTag.textContent = `@${session.user.username || session.user.id}`;
            submit.disabled = false;
            if (!status.dataset.locked) status.textContent = 'Ready to create a paste.';
            return;
        }
        submit.disabled = true;
        if (session && session.anonymous) {
            modeTag.textContent = 'read only';
            if (!status.dataset.locked) status.textContent = 'Anonymous identities can browse but cannot create pastes.';
            return;
        }
        modeTag.textContent = 'sign-in required';
        if (!status.dataset.locked) status.textContent = 'Sign in to create a new paste.';
    }

    document.getElementById('paste-reset-btn').addEventListener('click', () => {
        document.getElementById('paste-form').reset();
        delete document.getElementById('paste-status').dataset.locked;
        syncPasteComposer();
    });

    document.getElementById('paste-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const status = document.getElementById('paste-status');
        const imageUrl = (formData.get('image_url') || '').trim();
        try {
            const res = await fetch('/api/community/pastes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    title: formData.get('title'),
                    body: formData.get('body'),
                    metadata: imageUrl ? { image_url: imageUrl } : undefined,
                }),
            });
            if (!res.ok) throw new Error(`status ${res.status}`);
            delete status.dataset.locked;
            status.textContent = 'Paste created.';
            e.target.reset();
            closeModal();
            renderPastes(await loadPastes());
        } catch (err) {
            status.dataset.locked = 'true';
            status.textContent = `Failed: ${err.message} (sign in required)`;
        }
    });

    renderPastes(await loadPastes());
    await syncPasteComposer();
})();
</script>
</body>
</html>
