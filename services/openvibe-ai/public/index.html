<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OpenVibe AI — ai.openvibe.network</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<style>
body{font:14px/1.4 system-ui,sans-serif;margin:24px;color:#222;background:#fafafa}
h1{margin:0 0 4px;font-size:22px}
small{color:#888}
section{background:#fff;border:1px solid #eee;border-radius:8px;padding:16px;margin:16px 0}
pre{background:#f5f5f5;padding:8px;border-radius:6px;overflow:auto;max-height:300px}
button{background:#222;color:#fff;border:0;border-radius:6px;padding:6px 10px;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap}
.tag{display:inline-block;padding:2px 6px;border-radius:4px;background:#eef;color:#225;font-size:12px}
</style>
</head>
<body>
<h1>OpenVibe AI</h1>
<small>Canonical host: <span class="tag">ai.openvibe.network</span> &nbsp; Stub provider works offline (no API keys required).</small>

<section>
    <h3>Status</h3>
    <div class="row">
        <button onclick="load('/api/v1/ai/status', 'status')">/status</button>
        <button onclick="load('/api/v1/ai/providers', 'status')">providers</button>
        <button onclick="load('/api/v1/ai/routes', 'status')">routes</button>
        <button onclick="load('/api/v1/ai/workflows', 'status')">workflows</button>
        <button onclick="load('/api/v1/ai/sources', 'status')">sources</button>
        <button onclick="load('/api/v1/ai/search/status', 'status')">search</button>
    </div>
    <pre id="status">click a button…</pre>
</section>

<section>
    <h3>Run a stub generate</h3>
    <button onclick="run()">POST /api/v1/ai/generate</button>
    <pre id="run">…</pre>
</section>

<script>
async function load(p, target){
    const r = await fetch(p); document.getElementById(target).textContent = JSON.stringify(await r.json(), null, 2);
}
async function run(){
    const r = await fetch('/api/v1/ai/generate', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ input: { prompt: 'Hello, AI ' + new Date().toISOString() } })
    });
    document.getElementById('run').textContent = JSON.stringify(await r.json(), null, 2);
}
</script>
</body></html>
