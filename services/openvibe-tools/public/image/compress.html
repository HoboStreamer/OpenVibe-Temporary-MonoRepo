<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Compressor — OpenVibe Tools</title><style>:root{--bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a26;--border:#2a2a3d;--accent:#7c3aed;--accent2:#a855f7;--text:#e8e8f0;--text2:#9090a8;--card:#13131e;}*{box-sizing:border-box;margin:0;padding:0;}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;min-height:100vh;}nav{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 1.5rem;display:flex;align-items:center;height:56px;gap:1rem;}.nav-brand{font-size:1.1rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.nav-links{display:flex;gap:.5rem;margin-left:auto;}.nav-links a{padding:.375rem .75rem;border-radius:6px;font-size:.875rem;color:var(--text2);}main{max-width:640px;margin:0 auto;padding:2.5rem 1.5rem;}h1{font-size:1.75rem;font-weight:800;margin-bottom:.5rem;}.subtitle{color:var(--text2);margin-bottom:2rem;}.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-bottom:1.25rem;}.card-title{font-size:.875rem;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:1rem;}.drop-zone{border:2px dashed var(--border);border-radius:10px;padding:3rem 1.5rem;text-align:center;cursor:pointer;transition:border-color .2s;}.drop-zone:hover,.drop-zone.drag-over{border-color:var(--accent);background:rgba(124,58,237,.06);}.drop-zone input{display:none;}.file-info{display:none;align-items:center;gap:.75rem;padding:.75rem 1rem;background:var(--bg3);border-radius:8px;margin-top:1rem;}.file-info.show{display:flex;}.file-name{font-size:.875rem;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}.file-size{font-size:.8rem;color:var(--text2);}.opts{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}.form-group{display:flex;flex-direction:column;gap:.4rem;}.form-group label{font-size:.8rem;color:var(--text2);font-weight:500;}select,input[type=number]{background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:.5rem .75rem;font-size:.9rem;outline:none;width:100%;}.btn{display:flex;align-items:center;justify-content:center;gap:.5rem;padding:.75rem 1.5rem;border-radius:8px;font-size:.95rem;font-weight:600;cursor:pointer;border:none;width:100%;}.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;}.btn-primary:disabled{opacity:.4;cursor:not-allowed;}.btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border);margin-top:.75rem;}.pw{display:none;margin-top:1rem;}.pw.show{display:block;}.pbt{background:var(--border);border-radius:999px;height:6px;overflow:hidden;}.pbf{background:linear-gradient(90deg,var(--accent),var(--accent2));height:100%;border-radius:999px;transition:width .3s;width:0%;}.pl{font-size:.8rem;color:var(--text2);margin-top:.5rem;}.result{display:none;margin-top:1rem;}.result.show{display:block;}.rok{padding:1rem;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);border-radius:8px;margin-bottom:.75rem;display:flex;align-items:center;gap:.75rem;}.rerr{padding:1rem;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:8px;color:#ef4444;}.preview{max-width:100%;border-radius:8px;margin-top:.75rem;}.json-out{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:1rem;font-family:monospace;font-size:.8rem;line-height:1.6;white-space:pre-wrap;}</style></head><body>
<nav><a href="/" class="nav-brand">OpenVibe Tools</a><div class="nav-links"><a href="/audio">Audio</a><a href="/image" class="active">Image</a><a href="/text">Text</a><a href="/download">Download</a></div></nav>
<main><h1>🗜️ Image Compressor</h1><p class="subtitle">Reduce image file size while controlling output quality.</p>
<div class="card"><div class="card-title">Upload Image</div><div class="drop-zone" id="dz"><div style="font-size:2.5rem;margin-bottom:.75rem">🗜️</div><p><strong>Click to upload</strong> or drag & drop</p><input type="file" id="fi" accept="image/*"></div><div class="file-info" id="fileInfo"><span style="font-size:1.5rem">🖼️</span><span class="file-name" id="fileName"></span><span class="file-size" id="fileSize"></span></div></div>
<div class="card"><div class="card-title">Options</div><div class="opts"><div class="form-group"><label>Quality (1-100)</label><input type="number" id="quality" value="70" min="1" max="100"><div style="font-size:.75rem;color:var(--text2);margin-top:.25rem">Lower = smaller file. 70 is usually a good balance.</div></div><div class="form-group"><label>Output Format</label><select id="format"><option value="">Auto-detect</option><option value="jpg">JPEG (best for photos)</option><option value="webp">WebP (best compression)</option><option value="png">PNG (lossless)</option><option value="avif">AVIF (modern)</option></select></div></div></div>
<button class="btn btn-primary" id="btn" disabled>Compress Image</button>
<div class="pw" id="pw"><div class="pbt"><div class="pbf" id="pbf"></div></div><p class="pl" id="pl">Compressing…</p></div>
<div class="result" id="result"><div class="rok" id="rok"><span>✅</span><div><div style="font-weight:600">Compressed!</div><div style="font-size:.8rem;color:var(--text2)" id="savingsLabel"></div></div></div><div class="rerr" id="rerr"></div><a class="btn btn-secondary" id="dlBtn" style="display:none" download>⬇ Download</a><div id="jsonOut"></div><img class="preview" id="preview" style="display:none"></div>
</main>
<script>
var dz=document.getElementById("dz"),fi=document.getElementById("fi"),fileInfo=document.getElementById("fileInfo"),fileName=document.getElementById("fileName"),fileSize=document.getElementById("fileSize"),btn=document.getElementById("btn"),pw=document.getElementById("pw"),pbf=document.getElementById("pbf"),pl=document.getElementById("pl"),result=document.getElementById("result"),rok=document.getElementById("rok"),rerr=document.getElementById("rerr"),dlBtn=document.getElementById("dlBtn"),jsonOut=document.getElementById("jsonOut"),preview=document.getElementById("preview");
var selectedFile=null;
function fmtBytes(n){if(n<1024)return n+" B";if(n<1048576)return(n/1024).toFixed(1)+" KB";return(n/1048576).toFixed(1)+" MB";}
function setFile(f){selectedFile=f;fileName.textContent=f.name;fileSize.textContent=fmtBytes(f.size);fileInfo.classList.add("show");btn.disabled=false;result.classList.remove("show");}
dz.addEventListener("click",function(){fi.click();});fi.addEventListener("change",function(){if(fi.files[0])setFile(fi.files[0]);});
dz.addEventListener("dragover",function(e){e.preventDefault();dz.classList.add("drag-over");});dz.addEventListener("dragleave",function(){dz.classList.remove("drag-over");});
dz.addEventListener("drop",function(e){e.preventDefault();dz.classList.remove("drag-over");if(e.dataTransfer.files[0])setFile(e.dataTransfer.files[0]);});
var savingsLabel=document.getElementById("savingsLabel");
btn.addEventListener("click",async function(){
  if(!selectedFile)return;btn.disabled=true;result.classList.remove("show");pw.classList.add("show");pbf.style.width="30%";
  var fd=new FormData();fd.append("file",selectedFile);fd.append("quality",document.getElementById("quality").value);fd.append("format",document.getElementById("format").value);
  try{pbf.style.width="70%";pl.textContent="Compressing…";
    var res=await fetch("/image/api/compress",{method:"POST",body:fd});pbf.style.width="100%";
    if(!res.ok){var err=await res.json().catch(function(){return{error:res.statusText};});throw new Error(err.error||res.statusText);}
    var blob=await res.blob();var url=URL.createObjectURL(blob);
    var savings=Math.round((1-blob.size/selectedFile.size)*100);
    savingsLabel.textContent="Size: "+fmtBytes(selectedFile.size)+" → "+fmtBytes(blob.size)+(savings>0?" ("+savings+"% smaller)":"");
    var ext=res.headers.get("content-type")||"image/jpeg";ext=ext.split("/")[1]||"jpg";
    dlBtn.href=url;dlBtn.download="compressed."+ext;dlBtn.style.display="flex";
    preview.src=url;preview.style.display="block";
    rok.style.display="flex";rerr.style.display="none";result.classList.add("show");pl.textContent="Done!";
  }catch(e){rerr.textContent="❌ "+e.message;rok.style.display="none";rerr.style.display="block";result.classList.add("show");pl.textContent="Failed";}
  finally{setTimeout(function(){pw.classList.remove("show");pbf.style.width="0";},1200);btn.disabled=false;}
});
</script></body></html>
