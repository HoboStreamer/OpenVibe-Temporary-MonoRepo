<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>openre.stream — stream control</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="openre.stream — OBS ingest credentials and restream destinations for OpenVibe.">
    <style>
        :root {
            color-scheme: dark;
            --bg: #07101d;
            --bg-elev: rgba(14, 23, 42, 0.88);
            --bg-elev-2: rgba(19, 31, 56, 0.94);
            --text: #eef4ff;
            --muted: #a7b5d2;
            --border: rgba(148, 163, 184, 0.16);
            --primary: #8b5cf6;
            --accent: #22d3ee;
            --success: #34d399;
            --warn: #f59e0b;
            --danger: #fb7185;
            --shadow: 0 28px 90px rgba(2, 8, 23, 0.42);
        }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background:
                radial-gradient(circle at top left, rgba(139, 92, 246, 0.26), transparent 32%),
                radial-gradient(circle at 85% 12%, rgba(34, 211, 238, 0.18), transparent 25%),
                linear-gradient(180deg, #050914 0%, #07101d 42%, #050914 100%);
            color: var(--text);
        }
        a { color: inherit; text-decoration: none; }
        code {
            font-family: 'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 6px;
            padding: 0.15rem 0.45rem;
            font-size: 0.83rem;
            word-break: break-all;
        }
        .page-shell { width: min(1240px, calc(100vw - 2rem)); margin: 0 auto; }
        .topbar {
            position: sticky; top: 0; z-index: 20;
            backdrop-filter: blur(18px);
            background: rgba(5,9,20,0.74);
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .topbar-inner {
            min-height: 68px; display: flex; align-items: center;
            justify-content: space-between; gap: 1rem;
        }
        .brand { display: inline-flex; align-items: center; gap: 0.85rem; }
        .brand-mark {
            width: 2.6rem; height: 2.6rem; border-radius: 16px;
            display: grid; place-items: center; font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--accent));
        }
        .brand-copy b { display: block; letter-spacing: 0.01em; }
        .brand-copy span { color: var(--muted); font-size: 0.82rem; }
        .nav-links { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
        .nav-link {
            padding: 0.55rem 0.85rem; border-radius: 999px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
            color: #dbeafe; font-size: 0.88rem;
            transition: transform 0.18s ease;
        }
        .nav-link:hover { transform: translateY(-1px); }
        .button, .button-secondary, .button-ghost, .button-danger {
            display: inline-flex; align-items: center; justify-content: center;
            gap: 0.5rem; padding: 0.8rem 1.1rem; border-radius: 999px;
            border: 1px solid transparent; font-weight: 700; cursor: pointer;
            font-size: 0.92rem; font-family: inherit;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
        .button { background: linear-gradient(135deg, var(--primary), #4f46e5 60%, var(--accent)); color: white; }
        .button-secondary { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.1); color: white; }
        .button-ghost { background: rgba(255,255,255,0.03); border-color: rgba(255,255,255,0.08); color: var(--muted); }
        .button-danger { background: rgba(251,113,133,0.12); border-color: rgba(251,113,133,0.24); color: var(--danger); }
        .button:hover, .button-secondary:hover, .button-ghost:hover, .button-danger:hover { transform: translateY(-1px); }
        .button:disabled, .button-secondary:disabled, .button-ghost:disabled { opacity: 0.4; pointer-events: none; }
        .button-live { background: rgba(251,113,133,0.18); border: 1px solid rgba(251,113,133,0.35); color: #fecdd3; }
        .button-live:hover { transform: translateY(-1px); background: rgba(251,113,133,0.28); }
        main.page-shell { padding: 1.5rem 0 4rem; }
        .panel, .glass-card {
            background: linear-gradient(180deg, var(--bg-elev-2), var(--bg-elev));
            border: 1px solid var(--border); box-shadow: var(--shadow);
        }
        .panel { border-radius: 28px; padding: 1.4rem; margin-bottom: 1.1rem; }
        .glass-card { border-radius: 20px; padding: 1.1rem; }
        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .three-col { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; }
        .section-head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 1rem; gap: 1rem; }
        .section-head h2 { margin: 0 0 0.15rem; font-size: clamp(1.2rem, 2.5vw, 1.65rem); letter-spacing: -0.03em; }
        .eyebrow {
            display: inline-flex; align-items: center; gap: 0.4rem;
            padding: 0.4rem 0.7rem; border-radius: 999px;
            background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.08);
            color: rgba(191,219,254,0.92); font-size: 0.72rem;
            text-transform: uppercase; letter-spacing: 0.14em; font-weight: 800;
            margin-bottom: 0.75rem;
        }
        .stack { display: grid; gap: 0.75rem; }
        .pill {
            display: inline-flex; align-items: center; border-radius: 999px;
            padding: 0.35rem 0.65rem; font-size: 0.75rem;
            border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.05);
        }
        .pill.live { background: rgba(251,113,133,0.14); border-color: rgba(251,113,133,0.24); color: #fecdd3; }
        .pill.success { background: rgba(52,211,153,0.14); border-color: rgba(52,211,153,0.24); color: #a7f3d0; }
        .pill.muted { color: var(--muted); }
        .credential-row {
            display: flex; align-items: center; gap: 0.6rem;
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px; padding: 0.7rem 0.9rem;
        }
        .credential-label { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; min-width: 5rem; }
        .credential-value { flex: 1; font-family: 'SFMono-Regular', ui-monospace, monospace; font-size: 0.82rem; word-break: break-all; }
        .credential-actions { display: flex; gap: 0.4rem; flex-shrink: 0; }
        .icon-btn {
            display: inline-grid; place-items: center; width: 2rem; height: 2rem;
            border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.06); cursor: pointer; color: var(--muted);
            font-size: 0.75rem; font-family: inherit; transition: background 0.15s ease;
        }
        .icon-btn:hover { background: rgba(255,255,255,0.12); color: var(--text); }
        .form-stack { display: grid; gap: 0.7rem; }
        .form-stack label { display: grid; gap: 0.3rem; }
        .field-label { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; }
        .field-input {
            width: 100%; padding: 0.85rem 1rem; border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05);
            color: white; font-size: 0.95rem; outline: none; font-family: inherit;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .field-input:focus { border-color: rgba(34,211,238,0.34); box-shadow: 0 0 0 3px rgba(34,211,238,0.1); }
        .form-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; margin-top: 0.25rem; }
        .stack-item {
            padding: 0.85rem; border-radius: 16px;
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07);
        }
        .note { color: var(--muted); font-size: 0.88rem; margin: 0; line-height: 1.55; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
        .hero-signin {
            text-align: center; padding: 3.5rem 1rem;
        }
        .hero-signin h1 { font-size: clamp(2rem, 5vw, 3.2rem); letter-spacing: -0.04em; margin: 0.5rem 0; }
        .hero-signin p { color: var(--muted); max-width: 480px; margin: 0.75rem auto 1.5rem; }
        @media (max-width: 860px) { .two-col, .three-col { grid-template-columns: 1fr; } }
    </style>
    <link rel="stylesheet" href="/assets/openvibe-icons.css">
    <script src="/assets/openvibe-icons.js" defer></script>
</head>
<body>
    <header class="topbar">
        <div class="page-shell topbar-inner">
            <a class="brand" href="/">
                <span class="brand-mark">OR</span>
                <span class="brand-copy">
                    <b>openre.stream</b>
                    <span>Stream control for OpenVibe</span>
                </span>
            </a>
            <nav class="nav-links" aria-label="Primary">
                <a class="nav-link" href="https://openvibe.live">openvibe.live</a>
                <a class="nav-link" href="https://openvibe.community">community</a>
            </nav>
            <div id="nav-auth"></div>
        </div>
    </header>

    <main class="page-shell" id="main-content">
        <div style="padding:4rem 0;text-align:center;color:var(--muted)">Loading…</div>
    </main>

    <script>
    (function () {
        'use strict';

        const SURFACES = {
            network:   { origin: 'https://openvibe.network',      localHost: 'openvibe.network.localhost',   port: 4100 },
            auth:      { origin: 'https://auth.openvibe.network', localHost: 'auth.openvibe.network.localhost', port: 4100 },
            my:        { origin: 'https://my.openvibe.network',   localHost: 'my.openvibe.network.localhost', port: 4100 },
            live:      { origin: 'https://openvibe.live',         localHost: 'openvibe.live.localhost',       port: 4600 },
        };

        function isLocal() { return /localhost$/i.test(window.location.hostname || ''); }
        function surfaceUrl(name) {
            const c = SURFACES[name];
            if (!c) return '#';
            return isLocal() ? `${window.location.protocol}//${c.localHost}:${c.port}` : c.origin;
        }
        function signInUrl() {
            const u = new URL('/auth/login', window.location.origin);
            u.searchParams.set('return_to', window.location.href);
            return u.toString();
        }
        function signOutUrl() {
            const u = new URL('/auth/logout', window.location.origin);
            u.searchParams.set('return_to', window.location.href);
            return u.toString();
        }

        function esc(v) {
            return String(v == null ? '' : v)
                .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
        }

        function slugify(v) {
            return String(v||'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,48);
        }

        function relTime(v) {
            if (!v) return '';
            const d = Math.round((Date.now() - new Date(v).getTime()) / 1000);
            if (d < 60) return 'just now';
            if (d < 3600) return Math.floor(d/60) + 'm ago';
            if (d < 86400) return Math.floor(d/3600) + 'h ago';
            return Math.floor(d/86400) + 'd ago';
        }

        async function apiFetch(path, opts) {
            const r = Object.assign({ credentials: 'same-origin' }, opts || {});
            r.headers = Object.assign({ Accept: 'application/json' }, r.headers || {});
            const res = await fetch(path, r);
            const text = await res.text();
            let body;
            try { body = text ? JSON.parse(text) : null; } catch { body = text; }
            if (!res.ok) {
                const e = new Error((body && body.error) || `Error ${res.status}`);
                e.status = res.status; e.body = body; throw e;
            }
            return body;
        }

        // ── State ─────────────────────────────────────────────────────────────
        let _session = null;
        let _channel = null;

        // ── Session ───────────────────────────────────────────────────────────
        async function loadSession() {
            try {
                const s = await apiFetch('/api/v1/session');
                _session = {
                    authenticated: !!(s && s.authenticated),
                    anonymous: !!(s && s.anonymous),
                    user: s && s.user ? s.user : null,
                };
            } catch {
                _session = { authenticated: false, anonymous: false, user: null };
            }
            return _session;
        }

        // ── Channel auto-provision ────────────────────────────────────────────
        async function ensureChannel() {
            const user = _session && _session.user;
            if (!user) return null;

            const userId = String(user.id || user.sub || '');
            const payload = await apiFetch('/api/v1/channels?owner_user_id=' + encodeURIComponent(userId) + '&limit=1');
            const items = Array.isArray(payload && payload.items) ? payload.items : [];

            if (items.length > 0) {
                _channel = items[0];
                return _channel;
            }

            // Auto-create a channel from the user's username
            const slug = slugify(user.username || user.handle || userId.slice(0,16) || 'channel');
            try {
                const result = await apiFetch('/api/v1/channels', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        owner_user_id: userId,
                        slug,
                        display_name: user.display_name || user.username || slug,
                    }),
                });
                _channel = result.channel;
            } catch (err) {
                if (err.body && err.body.reason === 'slug_taken') {
                    const fallback = slugify(slug + '-' + userId.slice(-4));
                    const result2 = await apiFetch('/api/v1/channels', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            owner_user_id: userId,
                            slug: fallback,
                            display_name: user.display_name || user.username || fallback,
                        }),
                    });
                    _channel = result2.channel;
                } else {
                    throw err;
                }
            }
            return _channel;
        }

        // ── Destinations ──────────────────────────────────────────────────────
        async function loadDestinations() {
            const userId = _session && _session.user && String(_session.user.id || _session.user.sub || '');
            if (!userId) return [];
            const payload = await apiFetch('/api/v1/destinations?owner_user_id=' + encodeURIComponent(userId));
            return Array.isArray(payload && payload.items) ? payload.items : [];
        }

        async function loadRecentStreams() {
            if (!_channel) return [];
            const payload = await apiFetch('/api/v1/streams?channel_id=' + encodeURIComponent(_channel.id) + '&limit=6');
            return Array.isArray(payload && payload.items) ? payload.items : [];
        }

        // ── Render helpers ────────────────────────────────────────────────────
        function renderNavAuth() {
            const el = document.getElementById('nav-auth');
            if (!el) return;
            if (!_session || !_session.authenticated) {
                el.innerHTML = `<a class="nav-link" href="${esc(signInUrl())}">Sign in</a>`;
            } else {
                const name = esc(_session.user && (_session.user.display_name || _session.user.username) || 'Account');
                el.innerHTML = `<a class="nav-link" href="${esc(surfaceUrl('my'))}">${name}</a>`;
            }
        }

        function copyText(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                const orig = btn.textContent;
                btn.textContent = '✓';
                setTimeout(() => { btn.textContent = orig; }, 1500);
            }).catch(() => {});
        }

        function renderCredentials() {
            const ch = _channel;
            if (!ch) return '<p class="note">Your ingest credentials will appear here after your account is set up.</p>';

            const rtmpServer = ch.rtmp_url || 'rtmp://ingest.openre.stream/live';
            const streamKey  = ch.stream_key || '';
            const streamId   = `${esc(ch.slug)}?key=${esc(streamKey)}`;

            return `
                <div class="eyebrow">Your encoder setup (OBS / RTMP)</div>
                <div class="stack">
                    <div class="credential-row">
                        <span class="credential-label">Server</span>
                        <span class="credential-value" id="cred-server">${esc(rtmpServer)}</span>
                        <div class="credential-actions">
                            <button class="icon-btn" title="Copy" onclick="copyText('${esc(rtmpServer)}', this)">⧉</button>
                        </div>
                    </div>
                    <div class="credential-row">
                        <span class="credential-label">Stream key</span>
                        <span class="credential-value" id="cred-key" data-hidden="true" style="letter-spacing:0.18em">••••••••••••••••</span>
                        <span class="credential-value" id="cred-key-value" style="display:none">${esc(streamId)}</span>
                        <div class="credential-actions">
                            <button class="icon-btn" id="cred-reveal-btn" title="Reveal" onclick="toggleKeyReveal()">👁</button>
                            <button class="icon-btn" title="Copy" onclick="copyText('${esc(streamId)}', this)">⧉</button>
                        </div>
                    </div>
                </div>
                <p class="note" style="margin-top:0.75rem">In OBS: <strong>Settings → Stream → Custom</strong>. Paste the Server and Stream key above. Press Go Live in OBS — your stream will appear on <a href="${esc(surfaceUrl('live'))}/@${esc(ch.slug)}" style="color:var(--accent)">${esc(surfaceUrl('live'))}/@${esc(ch.slug)}</a>.</p>
                <div class="form-actions" style="margin-top:0.85rem">
                    <button class="button-ghost" style="font-size:0.82rem;padding:0.55rem 0.9rem" onclick="regenerateKey()">Regenerate key</button>
                </div>`;
        }

        function renderBrowserPanel() {
            const panel = document.getElementById('browser-panel');
            if (!panel) return;
            const ch = _channel;
            const goLiveUrl = surfaceUrl('live') + '/go-live';
            const channelUrl = ch ? (surfaceUrl('live') + '/@' + esc(ch.slug)) : surfaceUrl('live');
            panel.innerHTML = `
                <div class="eyebrow">Browser streaming</div>
                <p class="note" style="margin-bottom:1rem">Browser-based streaming is managed from the Stream Manager on openvibe.live. Your channel, chat, and stream controls are all there.</p>
                <a class="button" href="${esc(goLiveUrl)}" style="display:inline-flex">Go to Stream Manager →</a>
                ${ch ? `<p class="note" style="margin-top:0.75rem;font-size:0.8rem">Your channel: <a href="${esc(channelUrl)}" style="color:var(--accent)">openvibe.live/@${esc(ch.slug)}</a></p>` : ''}`;
        }

        function renderDestinations(destinations) {
            const el = document.getElementById('destinations-list');
            if (!el) return;
            if (!destinations.length) {
                el.innerHTML = '<p class="note">No restream destinations yet. Add platforms below.</p>';
                return;
            }
            el.innerHTML = destinations.map(d => `
                <div class="stack-item">
                    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:0.5rem">
                        <div>
                            <span class="pill muted" style="margin-bottom:0.4rem">${esc(d.kind||'custom')}</span>
                            <div style="font-weight:700;margin-top:0.35rem">${esc(d.label||d.kind||'Destination')}</div>
                            <p class="note" style="margin-top:0.2rem;font-size:0.8rem">${esc(d.target_url||'')}</p>
                        </div>
                        <button class="icon-btn" title="Delete" onclick="deleteDestination('${esc(d.id)}', this)" style="flex-shrink:0;margin-top:0.1rem">✕</button>
                    </div>
                </div>`).join('');
        }

        function renderStreams(streams) {
            const el = document.getElementById('streams-list');
            if (!el) return;
            if (!streams.length) {
                el.innerHTML = '<p class="note">No streams yet. Start one from the Stream Manager on openvibe.live or via OBS with your ingest credentials above.</p>';
                return;
            }
            el.innerHTML = streams.map(s => `
                <div class="stack-item">
                    <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.4rem">
                        <span class="pill ${s.status==='started'?'live':s.status==='ended'?'muted':''}">
                            ${esc(s.status||'created')}
                        </span>
                        ${s.protocol ? `<span class="pill muted">${esc(s.protocol)}</span>` : ''}
                    </div>
                    <div style="font-weight:700">${esc(s.title||'Untitled stream')}</div>
                    <p class="note" style="margin-top:0.2rem;font-size:0.8rem">${relTime(s.started_at||s.created_at)}</p>
                </div>`).join('');
        }

        function renderSignedOutPage() {
            document.getElementById('main-content').innerHTML = `
                <div class="panel hero-signin">
                    <div class="eyebrow">Restream control room</div>
                    <h1>Your stream.<br>Every platform.</h1>
                    <p>OBS ingest credentials and restream to YouTube, Twitch, Kick, or any RTMP destination simultaneously.</p>
                    <div style="display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap">
                        <a class="button" href="${esc(signInUrl())}">Sign in to get started</a>
                        <a class="button-secondary" href="${esc(surfaceUrl('live'))}">openvibe.live</a>
                    </div>
                </div>`;
        }

        async function renderFullDashboard() {
            const [destinations, streams] = await Promise.all([
                loadDestinations().catch(() => []),
                loadRecentStreams().catch(() => []),
            ]);

            const ch = _channel;
            const user = _session && _session.user;
            const username = user && (user.username || user.display_name) || '';

            document.getElementById('main-content').innerHTML = `
                <!-- Ingest + Browser -->
                <div class="two-col" style="margin-bottom:1.1rem">
                    <div class="panel">
                        ${renderCredentials()}
                    </div>
                    <div class="panel" id="browser-panel">
                        <!-- filled by renderBrowserPanel -->
                    </div>
                </div>

                <!-- Destinations -->
                <div class="panel">
                    <div class="section-head">
                        <div>
                            <h2>Restream destinations</h2>
                            <p class="note">Push your stream to other platforms simultaneously.</p>
                        </div>
                    </div>
                    <div class="two-col">
                        <div class="stack" id="destinations-list">
                            <p class="note">Loading…</p>
                        </div>
                        <div>
                            <form class="form-stack" id="destination-form">
                                <label>
                                    <span class="field-label">Platform</span>
                                    <select class="field-input" name="kind">
                                        <option value="youtube">YouTube</option>
                                        <option value="twitch">Twitch</option>
                                        <option value="kick">Kick</option>
                                        <option value="custom">Custom RTMP</option>
                                    </select>
                                </label>
                                <label>
                                    <span class="field-label">Label</span>
                                    <input class="field-input" type="text" name="label" placeholder="Main Twitch account" autocomplete="off">
                                </label>
                                <label>
                                    <span class="field-label">RTMP URL</span>
                                    <input class="field-input" type="url" name="target_url" placeholder="rtmp://live.twitch.tv/app" autocomplete="off">
                                </label>
                                <label>
                                    <span class="field-label">Stream key</span>
                                    <input class="field-input" type="text" name="target_key" placeholder="Paste the platform stream key" autocomplete="off">
                                </label>
                                <div class="form-actions">
                                    <button class="button-secondary" type="submit">Save destination</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Recent streams -->
                <div class="panel">
                    <div class="section-head">
                        <div>
                            <h2>Recent streams</h2>
                            ${ch ? `<p class="note">Your channel: <a href="${esc(surfaceUrl('live'))}/@${esc(ch.slug)}" style="color:var(--accent)">openvibe.live/@${esc(ch.slug)}</a></p>` : ''}
                        </div>
                    </div>
                    <div class="stack" id="streams-list"><p class="note">Loading…</p></div>
                </div>`;

            renderBrowserPanel();
            renderDestinations(destinations);
            renderStreams(streams);
            wireDestinationForm();
        }

        // ── Actions ───────────────────────────────────────────────────────────
        window.toggleKeyReveal = function() {
            const hidden = document.getElementById('cred-key');
            const visible = document.getElementById('cred-key-value');
            const btn = document.getElementById('cred-reveal-btn');
            if (!hidden || !visible) return;
            const isHidden = hidden.dataset.hidden === 'true';
            hidden.style.display = isHidden ? 'none' : 'inline';
            visible.style.display = isHidden ? 'inline' : 'none';
            hidden.dataset.hidden = isHidden ? 'false' : 'true';
            if (btn) btn.title = isHidden ? 'Hide' : 'Reveal';
        };

        window.regenerateKey = async function() {
            const ch = _channel;
            if (!ch) return;
            if (!confirm('Regenerate your stream key? You will need to update your OBS settings.')) return;
            try {
                const result = await apiFetch(`/api/v1/channels/${encodeURIComponent(ch.slug)}/regenerate-key`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: '{}',
                });
                _channel = result.channel;
                const credPanel = document.querySelector('.panel:first-of-type');
                if (credPanel) credPanel.innerHTML = renderCredentials();
            } catch (err) {
                alert('Could not regenerate key: ' + (err.message || 'error'));
            }
        };

        window.deleteDestination = async function(id, btn) {
            if (!confirm('Remove this destination?')) return;
            if (btn) btn.disabled = true;
            try {
                await apiFetch(`/api/v1/destinations/${encodeURIComponent(id)}`, { method: 'DELETE' });
                const destinations = await loadDestinations();
                renderDestinations(destinations);
            } catch (err) {
                if (btn) btn.disabled = false;
                alert('Could not remove: ' + (err.message || 'error'));
            }
        };

        window.copyText = copyText;

        function wireDestinationForm() {
            const form = document.getElementById('destination-form');
            if (!form) return;
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const user = _session && _session.user;
                if (!user) return;
                const userId = String(user.id || user.sub || '');
                const payload = {
                    owner_user_id: userId,
                    kind: form.querySelector('[name="kind"]').value || 'custom',
                    label: form.querySelector('[name="label"]').value.trim(),
                    target_url: form.querySelector('[name="target_url"]').value.trim(),
                    target_key: form.querySelector('[name="target_key"]').value.trim(),
                };
                if (!payload.target_url) return;
                try {
                    await apiFetch('/api/v1/destinations', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload),
                    });
                    form.reset();
                    const destinations = await loadDestinations();
                    renderDestinations(destinations);
                } catch (err) {
                    alert('Could not save destination: ' + (err.message || 'error'));
                }
            });
        }

        // ── Init ──────────────────────────────────────────────────────────────
        (async function init() {
            await loadSession();
            renderNavAuth();

            if (!_session || !_session.authenticated || _session.anonymous) {
                renderSignedOutPage();
                return;
            }

            try { await ensureChannel(); } catch (err) { console.warn('[openre] channel setup failed:', err.message); }
            await renderFullDashboard();
        })();

    })();
    </script>
    <script src="/assets/chat-bubble.js" defer></script>
</body>
</html>
