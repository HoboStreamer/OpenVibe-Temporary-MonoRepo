<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OpenVibe Chat</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="stylesheet" href="/assets/openvibe.css" />
<style>
body {
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}
#nav-mount { flex-shrink: 0; }

/* ── chat shell ── */
.chat-shell {
    flex: 1;
    min-height: 0;
    display: flex;
    gap: 0;
}

/* ── sidebar ── */
.chat-sidebar {
    width: 220px;
    flex-shrink: 0;
    border-right: 1px solid var(--ov-border);
    display: flex;
    flex-direction: column;
    background: color-mix(in srgb, var(--ov-bg) 92%, white);
    overflow-y: auto;
    padding: 0.75rem 0;
}
.chat-sidebar-label {
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ov-text-dim);
    padding: 0 0.9rem 0.4rem;
}
.chat-room-btn {
    all: unset;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.45rem 0.9rem;
    cursor: pointer;
    font-size: 0.85rem;
    color: var(--ov-text-dim);
    border-radius: 0;
    transition: background 0.12s, color 0.12s;
    width: 100%;
}
.chat-room-btn:hover { background: rgba(255,255,255,0.05); color: var(--ov-text); }
.chat-room-btn.active { background: rgba(139,92,246,0.12); color: var(--ov-accent); font-weight: 600; }
.chat-room-hash { font-size: 1rem; opacity: 0.6; }

/* ── main pane ── */
.chat-main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
}

.chat-topbar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.6rem 1.1rem;
    border-bottom: 1px solid var(--ov-border);
    background: color-mix(in srgb, var(--ov-bg) 92%, white);
}
.chat-topbar-name {
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--ov-text);
}
.chat-topbar-desc {
    font-size: 0.78rem;
    color: var(--ov-text-dim);
}

.chat-feed {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 0.75rem 1.1rem 0.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
}

.chat-empty {
    color: var(--ov-text-dim);
    font-size: 0.85rem;
    text-align: center;
    padding: 3rem 0;
    margin: auto 0;
}

.chat-msg {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 0.1rem 0.6rem;
    padding: 0.25rem 0.4rem;
    border-radius: 8px;
    transition: background 0.1s;
}
.chat-msg:hover { background: rgba(255,255,255,0.03); }

.chat-msg-name {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--ov-accent);
    white-space: nowrap;
    grid-column: 1;
    grid-row: 1;
    align-self: baseline;
}
.chat-msg-time {
    font-size: 0.68rem;
    color: var(--ov-text-dim);
    grid-column: 2;
    grid-row: 1;
    align-self: baseline;
}
.chat-msg-body {
    font-size: 0.9rem;
    color: var(--ov-text);
    line-height: 1.5;
    word-break: break-word;
    grid-column: 1 / -1;
    grid-row: 2;
}

/* ── composer ── */
.chat-composer {
    flex-shrink: 0;
    padding: 0.6rem 1.1rem;
    border-top: 1px solid var(--ov-border);
    background: color-mix(in srgb, var(--ov-bg) 92%, white);
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
}
.chat-composer-who {
    font-size: 0.72rem;
    color: var(--ov-text-dim);
}
.chat-composer-who b { color: var(--ov-accent); }
.chat-composer-who a { color: var(--ov-accent); text-decoration: underline; cursor: pointer; }
.chat-composer-row {
    display: flex;
    gap: 0.5rem;
    align-items: center;
}
.chat-input {
    flex: 1;
    background: color-mix(in srgb, var(--ov-bg) 75%, white);
    border: 1px solid var(--ov-border);
    border-radius: 10px;
    padding: 0.55rem 0.85rem;
    color: var(--ov-text);
    font-size: 0.9rem;
    font-family: var(--ov-font);
    outline: none;
    transition: border-color 0.15s;
}
.chat-input:focus { border-color: var(--ov-accent); }
.chat-input::placeholder { color: var(--ov-text-dim); }
.chat-input:disabled { opacity: 0.5; }


@media (max-width: 600px) {
    .chat-sidebar { display: none; }
}
</style>
</head>
<body>
<div id="nav-mount"></div>
<div id="phase16-chip" class="ov-chip" style="display:none" aria-hidden="true"></div>
<div class="chat-shell">
    <nav class="chat-sidebar">
        <div class="chat-sidebar-label">Rooms</div>
        <button class="chat-room-btn active" data-room="global" type="button">
            <span class="chat-room-hash">#</span>global
        </button>
    </nav>

    <div class="chat-main">
        <div class="chat-topbar">
            <span class="chat-room-hash" style="font-size:1.1rem;color:var(--ov-text-dim)">#</span>
            <span class="chat-topbar-name" id="topbar-name">global</span>
            <span class="chat-topbar-desc">OpenVibe global chat</span>
        </div>

        <div class="chat-feed" id="chat-feed">
            <div class="chat-empty" id="chat-empty">Connecting…</div>
        </div>

        <div class="chat-composer">
            <div class="chat-composer-who" id="composer-who"></div>
            <div class="chat-composer-row">
                <input class="chat-input" id="chat-input" type="text"
                    placeholder="Message #global…" maxlength="500" autocomplete="off" />
                <button class="ov-btn ov-btn-primary" id="chat-send" type="button">Send</button>
            </div>
        </div>
    </div>
</div>


<div id="footer-mount"></div>

<script src="/assets/openvibe-icons.js"></script>
<script src="/assets/openvibe.js"></script>
<script>
(async function () {
    const ROOM = 'global';
    const POLL = 2000;
    const MAX  = 150;

    await OpenVibe.primeEnvironment();
    await OpenVibe.renderChrome('chat');

    function esc(s) {
        return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function timeStr(ts) {
        return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    // ── identity ─────────────────────────────────────────────────
    const whoEl = document.getElementById('composer-who');

    let session = await fetch('/account/session').then(r => r.json()).catch(() => null);

    if (!session || !session.user) {
        // No session at all — auto-start an anonymous one
        await OpenVibe.startAnonymousSession().catch(() => {});
        session = await fetch('/account/session').then(r => r.json()).catch(() => null);
    }

    let myName = '';
    if (session && session.user) {
        const u = session.user;
        myName = u.display_name || u.username || u.id || 'Anonymous';
        if (session.anonymous) {
            whoEl.innerHTML = `Chatting anonymously as <b>${esc(myName)}</b>`;
        } else {
            whoEl.innerHTML = `Chatting as <b>@${esc(u.username || u.id)}</b>`;
        }
    } else {
        myName = 'Anonymous';
        whoEl.textContent = 'Chatting as Anonymous';
    }

    // ── messages ─────────────────────────────────────────────────
    const feed    = document.getElementById('chat-feed');
    const emptyEl = document.getElementById('chat-empty');
    let lastId = null;
    let msgs   = [];

    function render() {
        const atBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 80;
        if (!msgs.length) {
            feed.innerHTML = '<div class="chat-empty">No messages yet. Say something!</div>';
            return;
        }
        feed.innerHTML = msgs.map(m => {
            const name = (m.metadata && m.metadata.sender_name) || m.sender_id || 'Anonymous';
            return `<div class="chat-msg">
                <span class="chat-msg-name">${esc(name)}</span>
                <span class="chat-msg-time">${timeStr(m.created_at)}</span>
                <div class="chat-msg-body">${esc(m.body)}</div>
            </div>`;
        }).join('');
        if (atBottom || lastId === null) feed.scrollTop = feed.scrollHeight;
    }

    async function poll() {
        try {
            const res = await fetch(`/api/chat/rooms/${ROOM}/messages?limit=${MAX}`);
            if (!res.ok) return;
            const data = await res.json();
            const items = (data.items || []).slice().reverse();
            if (!items.length && lastId === null) { render(); return; }
            if (!items.length) return;
            const newest = items[items.length - 1].id;
            if (newest !== lastId) { msgs = items; lastId = newest; render(); }
        } catch {}
    }

    // ── WebSocket real-time push ──────────────────────────────────
    let wsConnected = false;
    let pollTimer = null;

    function connectWs() {
        try {
            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            const ws = new WebSocket(`${proto}://${location.host}/ws/chat`);
            ws.addEventListener('open', () => {
                wsConnected = true;
                ws.send(JSON.stringify({ type: 'join', roomId: ROOM, displayName: myName }));
                // Stop polling when WS is up
                if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
            });
            ws.addEventListener('message', (event) => {
                let msg;
                try { msg = JSON.parse(event.data); } catch { return; }
                if (msg.type === 'message' && msg.roomId === ROOM && msg.message) {
                    const m = msg.message;
                    const isDupe = msgs.some((x) => x.id === m.id);
                    if (!isDupe) {
                        msgs = [...msgs.slice(-MAX + 1), m];
                        lastId = m.id;
                        render();
                    }
                }
            });
            ws.addEventListener('close', () => {
                wsConnected = false;
                // Fall back to polling
                if (!pollTimer) pollTimer = setInterval(poll, POLL);
                // Reconnect after 3s
                setTimeout(connectWs, 3000);
            });
            ws.addEventListener('error', () => {
                ws.close();
            });
        } catch {
            // WebSocket not available, use polling only
            if (!pollTimer) pollTimer = setInterval(poll, POLL);
        }
    }

    // ── send ─────────────────────────────────────────────────────
    const input   = document.getElementById('chat-input');
    const sendBtn = document.getElementById('chat-send');

    async function send() {
        const text = input.value.trim();
        if (!text) return;
        input.value = '';
        input.disabled = true;
        sendBtn.disabled = true;
        try {
            await fetch(`/api/chat/rooms/${ROOM}/messages`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ body: text, metadata: { sender_name: myName } }),
            });
            // If WS is connected, message will arrive via push; otherwise poll now
            if (!wsConnected) await poll();
        } catch {}
        input.disabled = false;
        sendBtn.disabled = false;
        input.focus();
    }

    sendBtn.addEventListener('click', send);
    input.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });

    await poll();
    connectWs();
    // Also start a slow poll as backstop (every 10s)
    pollTimer = setInterval(poll, 10000);

})();
</script>
</body>
</html>
